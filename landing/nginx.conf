# Landing Tokenhood : nginx non root (port 8080) derrière le proxy TLS de Coolify.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;   # redirections relatives (/en -> /en/), correctes derrière le proxy

    # Aucun journal des visites (voir la politique de confidentialité) ; les erreurs restent journalisées.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript image/svg+xml application/xml text/plain;

    # Déclarés au niveau serveur et jamais dans une location, pour qu'ils s'appliquent partout.
    # form-action et connect-src : seuls les formulaires hébergés par Brevo (build.mjs refuse tout autre hôte).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.sibforms.com; form-action 'self' https://*.sibforms.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers à empreinte (site.<hash>.css, polices) : cache long.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Pages : revalidées à chaque visite, pour qu'un déploiement soit visible immédiatement.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
