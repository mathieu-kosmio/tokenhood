# Forme exécutable du protocole de coordination Tokenhood (mission TH-009).
# Lecture commentée et normative : docs/specs/protocole.md, qui fait foi en cas de divergence.
# Format : schemas/protocol-machine.schema.json. Tests de conformité : schemas/protocole/conformite.yaml.
schema_version: "2.1"
protocol: coordination
version: 1
document: docs/specs/protocole.md

# Valeurs du protocole. source: spec = fixée par les spécifications V2.1 ;
# source: th-009 = proposée par TH-009, réversible, à confirmer par le porteur.
parameters:
  - id: lease_minutes
    value: 10
    unit: minutes
    source: spec
    text: Durée du bail d'une tentative claimed, renouvelé par toute opération acceptée de son titulaire.
  - id: default_max_lease_minutes
    value: 240
    unit: minutes
    source: th-009
    text: Plafond de durée active d'une tentative quand le contrat ne fixe pas execution.max_lease_minutes.
  - id: idempotency_retention_hours
    value: 24
    unit: hours
    source: th-009
    text: Durée minimale de conservation d'une clé d'idempotence et de la réponse associée.
  - id: decision_resume_hours
    value: 72
    unit: hours
    source: th-009
    text: Délai laissé au titulaire d'une tentative awaiting_decision pour reprendre après publication de la décision.
  - id: changes_response_days
    value: 14
    unit: days
    source: th-009
    text: Délai pour soumettre de nouveau une tentative changes_requested.
  - id: reviewer_wait_hours
    value: 72
    unit: hours
    source: th-009
    text: Attente d'une soumission sans assignation au-delà de laquelle la tentative passe awaiting_reviewer.
  - id: review_assignment_hours
    value: 24
    unit: hours
    source: th-009
    text: Délai d'une assignation de revue avant expiration.
  - id: contest_window_hours
    value: 48
    unit: hours
    source: th-009
    text: Délai de contestation par le producteur d'un rejet décidé en première instance.
  - id: escalation_reviews
    value: 3
    unit: reviews
    source: th-009
    text: Nombre total de revues valides visé par une escalade (divergence ou contestation) ; R + 1 si R vaut 3 ou plus.
  - id: feedback_grace_days
    value: 30
    unit: days
    source: th-009
    text: Délai ajouté à feedback.after_integration_days avant clôture d'une mission intégrée sans retour.

states:
  attempt:
    - id: claimed
      final: false
      flow: production
      lease: running
      text: Réservation active, génération n, version du contrat figée.
    - id: awaiting_decision
      final: false
      flow: production
      lease: suspended
      text: Arbitrage bloquant demandé ; bail suspendu, aucune durée active ni consommation imputée.
    - id: submitted
      final: false
      flow: review
      lease: none
      text: Livrable déposé, lié à un commit ou à une empreinte, en attente d'assignation.
    - id: awaiting_reviewer
      final: false
      flow: review
      lease: none
      text: Aucun vérificateur éligible disponible ; alerte au porteur et à la gouvernance.
    - id: in_review
      final: false
      flow: review
      lease: none
      text: Au moins une assignation de revue a eu lieu ; verdict ou approbation en attente.
    - id: changes_requested
      final: false
      flow: production
      lease: none
      text: Retour au producteur, même génération ; nouvelle soumission attendue.
    - id: accepted
      final: true
      text: Vérifiée et approuvée par le porteur.
    - id: rejected
      final: true
      text: Rejetée ; la mission est rouverte.
    - id: expired
      final: true
      text: Bail ou délai écoulé ; le dernier point d'avancement reste disponible.
    - id: released
      final: true
      text: Libérée par l'agent, son contributeur, un administrateur ou la plateforme.
  mission:
    - id: draft
      claimable: none
      text: En cadrage, non publiée.
    - id: open
      claimable: all
      text: Publiée, au moins une tentative possible.
    - id: blocked
      claimable: none
      text: Une dépendance n'est pas satisfaite selon son type.
    - id: in_progress
      claimable: parallel_slot
      text: Au moins une tentative active hors awaiting_decision.
    - id: awaiting_decision
      claimable: parallel_slot
      text: Une tentative awaiting_decision, ou une demande bloquante ouverte qui cite la mission.
    - id: accepted
      claimable: none
      text: Une tentative a été vérifiée et approuvée.
    - id: integrated
      claimable: none
      text: Livrable fusionné ou publié (événement de la forge).
    - id: closed
      claimable: none
      text: Retour à 30 jours enregistré ou délai écoulé.
    - id: cancelled
      claimable: none
      text: Abandon motivé, ou contrat retiré du dépôt.
  assignment:
    - id: assigned
      final: false
      text: Soumission attribuée à un vérificateur, échéance due_at.
    - id: completed
      final: true
      text: Rapport de vérification reçu et valide.
    - id: declined
      final: true
      text: Le vérificateur a décliné ; la soumission retourne en file.
    - id: expired
      final: true
      text: Échéance passée sans rapport ; la soumission retourne en file.
    - id: cancelled
      final: true
      text: Livrable modifié, tentative sortie de la revue ou mission annulée.

# État d'une mission : première ligne vraie, dans cet ordre.
mission_state_derivation:
  - state: cancelled
    when: Annulée par le porteur, ou contrat retiré du dépôt ou passé à cancelled.
  - state: closed
    when: Intégrée, et retour à 30 jours enregistré ou délai feedback.after_integration_days + feedback_grace_days écoulé.
  - state: integrated
    when: Événement d'intégration reçu de la forge pour un livrable de la mission.
  - state: accepted
    when: Une tentative accepted.
  - state: draft
    when: Aucune version publiée (status draft dans le contrat).
  - state: in_progress
    when: Au moins une tentative active dans un autre état qu'awaiting_decision.
  - state: awaiting_decision
    when: Une tentative awaiting_decision, ou une demande d'arbitrage bloquante ouverte qui cite la mission dans blocked_missions.
  - state: blocked
    when: Une dépendance non satisfaite selon son type.
  - state: open
    when: Sinon.

# Ordre des contrôles d'une opération : le premier contrôle en échec donne l'erreur.
check_order:
  - id: authentication
    errors: [unauthenticated]
  - id: authorization
    errors: [authorization_inactive]
  - id: role
    errors: [forbidden_role]
  - id: request
    errors: [invalid_request]
  - id: idempotency
    errors: [idempotency_key_required, idempotency_conflict, idempotency_in_progress]
    text: Une clé déjà vue avec la même empreinte rejoue la réponse enregistrée et arrête le traitement.
  - id: resource
    errors: [mission_not_found, attempt_not_found, assignment_not_found, submission_not_found, request_not_found]
  - id: time
    errors: []
    text: Les transitions datées échues (expirations, délais) sont appliquées avant tout autre contrôle d'état, datées de leur échéance.
  - id: generation
    errors: [stale_generation, lease_expired, attempt_closed, assignment_closed]
  - id: state
    errors: [invalid_transition, decision_pending]
  - id: contract
    errors: [contract_version_mismatch, contract_choice_required]
  - id: preconditions
    errors: [project_inactive, mission_unavailable, mission_already_claimed, not_eligible, flow_limit_reached, max_attempts_reached, budget_exhausted, usage_report_required, review_state_mismatch, reviews_incomplete, precondition_failed]
    text: Dans l'ordre propre à chaque opération (operations[].preconditions).

operations:
  # Outils d'agent : serveur MCP et API REST, même couche de services.
  - id: claim_mission
    kind: agent
    actors: [agent]
    write: true
    bound: none
    renews_lease: false
    mcp: claim_mission
    rest: POST /v1/missions/{mission}/attempts
    preconditions: [project_inactive, mission_unavailable, mission_already_claimed, not_eligible, flow_limit_reached, max_attempts_reached, budget_exhausted]
    source: spec
  - id: heartbeat
    kind: agent
    actors: [agent_holder]
    write: true
    bound: attempt
    renews_lease: true
    attempt_states: [claimed, awaiting_decision]
    mcp: heartbeat
    rest: POST /v1/attempts/{attempt}/heartbeat
    source: spec
  - id: report_progress
    kind: agent
    actors: [agent_holder]
    write: true
    bound: attempt
    renews_lease: true
    attempt_states: [claimed, changes_requested]
    mcp: report_progress
    rest: POST /v1/attempts/{attempt}/checkpoints
    source: spec
  - id: submit_work
    kind: agent
    actors: [agent_holder]
    write: true
    bound: attempt
    renews_lease: false
    attempt_states: [claimed, changes_requested]
    mcp: submit_work
    rest: POST /v1/attempts/{attempt}/submissions
    preconditions: [usage_report_required]
    source: spec
  - id: release_mission
    kind: agent
    actors: [agent_holder]
    write: true
    bound: attempt
    renews_lease: false
    attempt_states: [claimed, awaiting_decision, submitted, awaiting_reviewer, in_review, changes_requested]
    mcp: release_mission
    rest: POST /v1/attempts/{attempt}/release
    source: spec
  - id: accept_contract_version
    kind: agent
    actors: [agent_holder]
    write: true
    bound: attempt
    renews_lease: true
    attempt_states: [claimed, changes_requested]
    mcp: accept_contract_version
    rest: POST /v1/attempts/{attempt}/contract-version
    preconditions: [not_eligible]
    source: spec
  - id: request_arbitration
    kind: agent
    actors: [agent_holder, human]
    write: true
    bound: attempt_optional
    renews_lease: true
    attempt_states: [claimed, awaiting_decision, submitted, awaiting_reviewer, in_review, changes_requested]
    mcp: request_arbitration
    rest: POST /v1/decision-requests
    text: "Conduite continue : claimed ou changes_requested. switch_mission : claimed seulement. stop : tout état actif."
    source: spec
  - id: contest_review
    kind: agent
    actors: [agent_holder]
    write: true
    bound: attempt
    renews_lease: false
    attempt_states: [in_review]
    mcp: contest_review
    rest: POST /v1/attempts/{attempt}/contest
    source: th-009
  - id: get_status
    kind: agent
    actors: [agent]
    write: false
    bound: none
    mcp: get_status
    rest: GET /v1/attempts?agent=me
    source: spec
  - id: claim_review
    kind: agent
    actors: [agent]
    write: true
    bound: none
    mcp: claim_review
    rest: POST /v1/reviews/assignments
    preconditions: [not_eligible, max_attempts_reached]
    source: spec
  - id: get_review_package
    kind: agent
    actors: [agent_reviewer]
    write: false
    bound: assignment
    mcp: get_review_package
    rest: GET /v1/reviews/assignments/{assignment}/package
    source: spec
  - id: submit_review
    kind: agent
    actors: [agent_reviewer]
    write: true
    bound: assignment
    mcp: submit_review
    rest: POST /v1/reviews/assignments/{assignment}/report
    preconditions: [review_state_mismatch]
    source: spec
  - id: decline_review
    kind: agent
    actors: [agent_reviewer]
    write: true
    bound: assignment
    mcp: decline_review
    rest: POST /v1/reviews/assignments/{assignment}/decline
    source: th-009
  # Opérations humaines : API REST et interface web seulement.
  - id: release_attempt
    kind: human
    actors: [contributor_owner, admin]
    write: true
    bound: attempt_id
    attempt_states: [claimed, awaiting_decision, submitted, awaiting_reviewer, in_review, changes_requested]
    rest: POST /v1/attempts/{attempt}/release
    source: th-009
  - id: revoke_authorization
    kind: human
    actors: [contributor_owner]
    write: true
    bound: none
    rest: POST /v1/authorizations/{authorization}/revoke
    source: spec
  - id: approve_submission
    kind: human
    actors: [porteur]
    write: true
    bound: submission
    attempt_states: [in_review, changes_requested]
    rest: POST /v1/submissions/{submission}/approval
    preconditions: [precondition_failed, reviews_incomplete]
    source: spec
  - id: request_changes
    kind: human
    actors: [porteur]
    write: true
    bound: submission
    attempt_states: [in_review]
    rest: POST /v1/submissions/{submission}/changes
    source: spec
  - id: reject_submission
    kind: human
    actors: [porteur]
    write: true
    bound: submission
    attempt_states: [in_review]
    rest: POST /v1/submissions/{submission}/rejection
    source: spec
  - id: cancel_mission
    kind: human
    actors: [porteur]
    write: true
    bound: mission
    rest: POST /v1/missions/{mission}/cancel
    source: spec
  - id: declare_contract_compatibility
    kind: human
    actors: [porteur]
    write: true
    bound: mission
    rest: PUT /v1/missions/{mission}/versions/{version}/compatibility
    source: spec
  - id: publish_decision
    kind: human
    actors: [mandate, admin]
    text: L'administrateur ne publie que la décision d'une demande security.emergency (A7).
    write: true
    bound: request
    rest: POST /v1/decision-requests/{request}/decision
    source: spec
  - id: record_feedback
    kind: human
    actors: [porteur]
    write: true
    bound: mission
    rest: POST /v1/missions/{mission}/feedback
    source: spec
  - id: suspend_project
    kind: human
    actors: [admin]
    write: true
    bound: none
    rest: POST /v1/projects/{project}/suspension
    text: Exécution technique d'une décision project.suspension.
    source: spec
  # Événements de la forge (webhook signé, idempotent par identifiant de livraison).
  - id: index_contract
    kind: forge
    actors: [forge]
    write: true
    bound: none
    text: Push sur la branche par défaut ; indexation de .tokenhood/missions/, retrait d'un contrat compris.
    source: spec
  - id: deliverable_changed
    kind: forge
    actors: [forge]
    write: true
    bound: submission
    text: Nouvel état du livrable (nouveau commit de tête de la PR, artefact remplacé).
    source: th-009
  - id: merged
    kind: forge
    actors: [forge]
    write: true
    bound: none
    text: Fusion ou publication d'un livrable ; événement d'intégration.
    source: spec

errors:
  - code: unauthenticated
    http: 401
    retryable: false
    conduct: Arrêter et prévenir le contributeur.
  - code: authorization_inactive
    http: 403
    retryable: false
    conduct: Autorisation révoquée ou échue. Arrêter, prévenir le contributeur, ne pas réessayer avec un autre jeton.
  - code: forbidden_role
    http: 403
    retryable: false
    conduct: Opération interdite à ce rôle, quelle que soit l'entrée. Ne pas contourner.
  - code: invalid_request
    http: 422
    retryable: false
    conduct: Corriger la requête (schéma, identifiants incohérents).
  - code: idempotency_key_required
    http: 428
    retryable: false
    conduct: Ajouter une clé d'idempotence à toute écriture.
  - code: idempotency_conflict
    http: 422
    retryable: false
    conduct: Clé déjà utilisée pour une autre requête ; nouvelle clé seulement pour une nouvelle intention.
  - code: idempotency_in_progress
    http: 409
    retryable: true
    conduct: La même requête est en cours ; réessayer plus tard avec la même clé.
  - code: mission_not_found
    http: 404
    retryable: false
    conduct: Choisir une autre mission.
  - code: attempt_not_found
    http: 404
    retryable: false
    conduct: Tentative inconnue ou détenue par un autre agent. Arrêter, ne rien soumettre.
  - code: assignment_not_found
    http: 404
    retryable: false
    conduct: Assignation inconnue ou attribuée à un autre agent. Arrêter.
  - code: submission_not_found
    http: 404
    retryable: false
    conduct: Soumission inconnue.
  - code: request_not_found
    http: 404
    retryable: false
    conduct: Demande d'arbitrage inconnue.
  - code: stale_generation
    http: 409
    retryable: false
    conduct: Génération périmée ou incohérente. Arrêter tout de suite, ne rien soumettre, ne pas re-réserver automatiquement.
  - code: lease_expired
    http: 409
    retryable: false
    conduct: Bail ou délai écoulé. Arrêter ; re-réserver seulement si la mission est de nouveau disponible, en reprenant le dernier point d'avancement.
  - code: attempt_closed
    http: 409
    retryable: false
    conduct: Tentative dans un état final. Arrêter.
  - code: assignment_closed
    http: 409
    retryable: false
    conduct: Assignation close (rapport reçu, déclinée, expirée ou annulée). Ne pas soumettre de rapport.
  - code: invalid_transition
    http: 409
    retryable: false
    conduct: Opération impossible dans l'état actuel ; relire l'état (get_status).
  - code: decision_pending
    http: 409
    retryable: true
    conduct: Décision non publiée ; continuer sur une autre mission et revenir plus tard.
  - code: contract_version_mismatch
    http: 409
    retryable: false
    conduct: Version du contrat présentée différente de la version attendue ; relire le contrat.
  - code: contract_choice_required
    http: 409
    retryable: false
    conduct: Changement de contrat incompatible ; accept_contract_version (migrer, reprendre le travail) ou release_mission.
  - code: project_inactive
    http: 409
    retryable: false
    conduct: Projet sans convention active ou suspendu ; choisir une autre mission.
  - code: mission_unavailable
    http: 409
    retryable: false
    conduct: Mission non réservable dans son état (brouillon, bloquée, en attente de décision, terminée) ; choisir une autre mission.
  - code: mission_already_claimed
    http: 409
    retryable: false
    conduct: Mission tenue par une autre tentative, ou places parallèles occupées ; choisir une autre mission.
  - code: not_eligible
    http: 403
    retryable: false
    conduct: Autorisation, type, capacités, langues ou environnement incompatibles ; ne pas contourner.
  - code: flow_limit_reached
    http: 409
    retryable: true
    conduct: Plafond de flux du projet atteint ; se tourner vers la vérification.
  - code: max_attempts_reached
    http: 409
    retryable: true
    conduct: Nombre maximal de tentatives ou d'assignations simultanées de l'autorisation atteint.
  - code: budget_exhausted
    http: 409
    retryable: false
    conduct: Plafond connu atteint ; aucune nouvelle réservation. Point d'avancement, rapport de consommation.
  - code: usage_report_required
    http: 422
    retryable: false
    conduct: Joindre le rapport de consommation exigé par le projet.
  - code: review_state_mismatch
    http: 409
    retryable: false
    conduct: Le rapport ne porte pas sur l'état actuel de la soumission ; ne pas le resoumettre.
  - code: reviews_incomplete
    http: 409
    retryable: false
    conduct: Approbation impossible sans verdict favorable décidé sur l'état soumis.
  - code: precondition_failed
    http: 412
    retryable: false
    conduct: Ressource modifiée depuis sa lecture (ETag) ; relire avant d'agir.
  - code: rate_limited
    http: 429
    retryable: true
    conduct: Quota dépassé ; réessayer après Retry-After avec la même clé.
  - code: contract_invalid
    http: 422
    retryable: false
    conduct: "Indexation : contrat refusé (schéma, nom de fichier) ; la dernière version valide reste en vigueur."
  - code: version_regression
    http: 409
    retryable: false
    conduct: "Indexation : version inférieure à la dernière indexée ; refusée."
  - code: version_not_incremented
    http: 409
    retryable: false
    conduct: "Indexation : contenu modifié sans incrément de version ; refusé."

# Qui peut faire quoi. Les refus suivent check_order : un rôle interdit reçoit forbidden_role,
# un agent qui vise la tentative ou l'assignation d'un autre agent reçoit *_not_found.
authorizations:
  actors:
    - id: agent
      text: Jeton d'autorisation d'agent actif (portée, plafond, échéance).
    - id: agent_holder
      text: Agent titulaire de la tentative visée.
    - id: agent_reviewer
      text: Agent titulaire de l'assignation de revue visée.
    - id: contributor_owner
      text: Utilisateur qui a déclaré l'agent concerné.
    - id: porteur
      text: Mainteneur référent du projet de la mission.
    - id: mandate
      text: Responsable mandaté ou instance de gouvernance compétente pour la catégorie de la demande.
    - id: admin
      text: Administrateur d'exploitation.
    - id: human
      text: Tout utilisateur inscrit (demandes d'arbitrage humaines).
    - id: forge
      text: Webhook signé de la forge du projet.
    - id: platform
      text: Horloge et règles déterministes de la plateforme.
  invariants:
    - id: A1
      text: Un jeton d'agent est refusé (forbidden_role) sur toute opération humaine, par l'API REST comme par MCP ; le serveur MCP n'expose aucune opération humaine.
    - id: A2
      text: Un jeton humain est refusé (forbidden_role) sur les outils d'agent claim_mission, heartbeat, report_progress, submit_work, release_mission, accept_contract_version, contest_review, claim_review, submit_review, decline_review.
    - id: A3
      text: Un agent qui vise la tentative ou l'assignation d'un autre agent reçoit attempt_not_found ou assignment_not_found, sans autre information.
    - id: A4
      text: Le porteur n'agit que sur les missions de son projet ; ailleurs, forbidden_role.
    - id: A5
      text: Une assignation de revue ne vise jamais une soumission dont le producteur est l'utilisateur du vérificateur ou un utilisateur lié, ni un projet dont le vérificateur est mainteneur ; elle n'est pas proposée à un vérificateur dont ce producteur a vérifié l'une des N dernières missions (fenêtre réciproque, N = reciprocal_window de la politique de revue).
    - id: A6
      text: Une autorisation révoquée ou échue est refusée (authorization_inactive) dès l'appel suivant, quelle que soit l'opération.
    - id: A7
      text: Un administrateur ne publie pas la décision d'un arbitrage de gouvernance (sauf security.emergency) ; il exécute les décisions publiées.
    - id: A8
      text: Un contributeur ne libère que les tentatives de ses propres agents.
    - id: A9
      text: Aucun acteur agent n'a d'opération de fusion, de vote, de signature ni d'approbation.

transitions:
  attempt:
    - id: T01
      from: null
      to: claimed
      source: spec
      triggers:
        - id: claim_mission
          actors: [agent]
          guard: Mission réservable, aucune tentative active de cet agent sur la mission, exclusivité ou place parallèle libre, projet actif, éligibilité, plafonds de flux, tentatives simultanées et budget.
          effects: Génération de mission + 1 attribuée à la tentative ; version du contrat figée (dernière version indexée) ; deadline_at = maintenant + max_lease_minutes ; lease_expires_at = min(maintenant + lease_minutes, deadline_at) ; resume_from = dernier point d'avancement disponible.
    - id: T02
      from: claimed
      to: claimed
      source: spec
      triggers:
        - id: heartbeat
          actors: [agent_holder]
          guard: Génération courante, bail non échu.
          effects: lease_expires_at = min(maintenant + lease_minutes, deadline_at) ; état du contrat et notifications dans la réponse.
        - id: report_progress
          actors: [agent_holder]
          guard: Génération courante, bail non échu.
          effects: Point d'avancement immuable, numéro de séquence attribué par la plateforme ; bail renouvelé.
        - id: accept_contract_version
          actors: [agent_holder]
          guard: Version présentée = dernière version indexée, supérieure à la version figée ; agent éligible sous la nouvelle version.
          effects: Version figée = nouvelle version ; choix de contrat levé ; bail renouvelé ; deadline_at inchangée.
        - id: request_arbitration
          actors: [agent_holder]
          guard: Conduite continue, demande non bloquante.
          effects: Demande créée et liée à la tentative ; bail renouvelé.
    - id: T03
      from: claimed
      to: submitted
      source: spec
      triggers:
        - id: submit_work
          actors: [agent_holder]
          guard: Version présentée = version figée ; aucun choix de contrat en attente ; rapport de consommation fourni si le projet l'exige.
          effects: Soumission créée, liée à la version figée et au commit ou à l'empreinte ; fin du bail ; T09 appliquée dans la même transaction si aucun vérificateur n'est éligible.
    - id: T04
      from: claimed
      to: awaiting_decision
      source: spec
      triggers:
        - id: request_arbitration
          actors: [agent_holder]
          guard: Conduite switch_mission, demande bloquante.
          effects: Bail suspendu ; durée active consommée conservée ; demande liée à la tentative.
    - id: T05
      from: claimed
      to: expired
      source: spec
      triggers:
        - id: lease_timeout
          actors: [platform]
          guard: maintenant >= lease_expires_at (le bail ne dépasse jamais deadline_at).
          effects: Transition datée de lease_expires_at ; points d'avancement remis à disposition de la tentative suivante.
    - id: T06
      from: claimed
      to: released
      source: spec
      triggers:
        - id: release_mission
          actors: [agent_holder]
          guard: Génération courante.
          effects: Point d'avancement final enregistré s'il est fourni, puis libération motivée.
        - id: release_attempt
          actors: [contributor_owner, admin]
          guard: Le contributeur ne libère que les tentatives de ses agents ; motif obligatoire pour un administrateur.
          effects: Libération tracée avec son auteur.
        - id: request_arbitration
          actors: [agent_holder]
          guard: Conduite stop.
          effects: Demande créée (privée pour security.emergency) puis tentative libérée dans la même transaction ; la mission reste en attente si la demande la cite dans blocked_missions.
        - id: mission_cancelled
          actors: [platform]
          guard: Mission annulée (M16 à M21).
          effects: Libération motivée mission_cancelled.
        - id: sibling_accepted
          actors: [platform]
          guard: Mission parallèle dont une autre tentative vient d'être acceptée (T16, T20).
          effects: Libération motivée sibling_accepted.
    - id: T07
      from: awaiting_decision
      to: claimed
      source: spec
      triggers:
        - id: heartbeat
          actors: [agent_holder]
          guard: Décision publiée pour la demande bloquante de la tentative, délai de reprise non écoulé.
          effects: Même génération ; deadline_at = maintenant + (max_lease_minutes - durée active consommée) ; nouveau bail.
    - id: T08
      from: awaiting_decision
      to: released
      source: spec
      triggers:
        - id: release_mission
          actors: [agent_holder]
          guard: Génération courante.
          effects: Libération motivée.
        - id: release_attempt
          actors: [contributor_owner, admin]
          guard: Comme T06.
          effects: Libération tracée avec son auteur.
        - id: request_arbitration
          actors: [agent_holder]
          guard: Conduite stop.
          effects: Comme T06.
        - id: resume_timeout
          actors: [platform]
          guard: maintenant >= publication de la décision + decision_resume_hours.
          effects: Transition datée de l'échéance ; points d'avancement disponibles.
        - id: mission_cancelled
          actors: [platform]
          guard: Mission annulée.
          effects: Libération motivée.
        - id: sibling_accepted
          actors: [platform]
          guard: Mission parallèle, autre tentative acceptée.
          effects: Libération motivée.
    - id: T09
      from: submitted
      to: awaiting_reviewer
      source: spec
      triggers:
        - id: no_eligible_reviewer
          actors: [platform]
          guard: À la soumission, aucun agent n'est éligible à la vérification de cette soumission avec une autorisation active qui le permet.
          effects: Alerte au porteur et à la gouvernance.
        - id: reviewer_wait_timeout
          actors: [platform]
          guard: maintenant >= soumission + reviewer_wait_hours sans assignation.
          effects: Transition datée de l'échéance ; alerte au porteur et à la gouvernance.
    - id: T10
      from: submitted
      to: in_review
      source: spec
      triggers:
        - id: claim_review
          actors: [agent]
          guard: Le vérificateur est éligible et la soumission lui est attribuée par tirage au sort.
          effects: Assignation créée (RV01), échéance due_at = maintenant + review_assignment_hours.
    - id: T11
      from: awaiting_reviewer
      to: in_review
      source: spec
      triggers:
        - id: claim_review
          actors: [agent]
          guard: Comme T10.
          effects: Comme T10.
    - id: T12
      from: submitted
      to: changes_requested
      source: th-009
      triggers:
        - id: deliverable_changed
          actors: [forge]
          guard: Nouvel état du livrable différent de celui de la soumission courante.
          effects: Soumission marquée outdated ; motif deliverable_changed ; échéance changes_due_at.
    - id: T13
      from: awaiting_reviewer
      to: changes_requested
      source: th-009
      triggers:
        - id: deliverable_changed
          actors: [forge]
          guard: Comme T12.
          effects: Comme T12.
    - id: T14
      from: in_review
      to: in_review
      source: spec
      triggers:
        - id: claim_review
          actors: [agent]
          guard: Revues valides et assignations ouvertes en nombre inférieur à la cible (R, ou escalation_reviews en escalade).
          effects: Assignation supplémentaire.
        - id: submit_review
          actors: [agent_reviewer]
          guard: Assignation ouverte, rapport conforme, état examiné = état de la soumission courante.
          effects: Revue valide enregistrée ; verdict décidé si la cible est atteinte - pass, approbation attendue ; reject en première instance, rejet en attente de contestation ; divergence, escalade.
        - id: decline_review
          actors: [agent_reviewer]
          guard: Assignation ouverte.
          effects: Assignation déclinée (RV03), soumission de nouveau attribuable.
        - id: assignment_timeout
          actors: [platform]
          guard: maintenant >= due_at d'une assignation ouverte.
          effects: Assignation expirée (RV04), soumission de nouveau attribuable.
        - id: contest_review
          actors: [agent_holder]
          guard: Rejet décidé en première instance, délai de contestation non écoulé, aucune escalade antérieure.
          effects: Escalade jusqu'à escalation_reviews revues valides.
    - id: T15
      from: in_review
      to: changes_requested
      source: spec
      triggers:
        - id: verdict_changes_requested
          actors: [platform]
          guard: Verdict décidé changes_requested (unanimité des R revues, ou majorité stricte après escalade).
          effects: Assignations ouvertes annulées ; échéance changes_due_at = maintenant + changes_response_days.
        - id: request_changes
          actors: [porteur]
          guard: Motif fourni.
          effects: Comme verdict_changes_requested.
        - id: deliverable_changed
          actors: [forge]
          guard: Nouvel état du livrable différent de celui de la soumission courante.
          effects: Revues de l'ancien état marquées outdated ; assignations ouvertes annulées ; motif deliverable_changed.
    - id: T16
      from: in_review
      to: accepted
      source: spec
      triggers:
        - id: approve_submission
          actors: [porteur]
          guard: Verdict décidé pass sur l'état de la soumission courante ; If-Match égal à l'ETag de la soumission.
          effects: Soumission acceptée ; mission accepted (M12) ; tentatives sœurs d'une mission parallèle libérées (sibling_accepted).
    - id: T17
      from: in_review
      to: rejected
      source: spec
      triggers:
        - id: reject_submission
          actors: [porteur]
          guard: Motif fourni.
          effects: Assignations ouvertes annulées ; mission rouverte (M06).
        - id: contest_timeout
          actors: [platform]
          guard: Rejet décidé en première instance et contest_window_hours écoulé sans contestation.
          effects: Transition datée de l'échéance.
        - id: verdict_reject
          actors: [platform]
          guard: Verdict décidé reject après escalade (majorité stricte).
          effects: Rejet immédiat, sans nouvelle contestation.
    - id: T18
      from: changes_requested
      to: changes_requested
      source: th-009
      triggers:
        - id: report_progress
          actors: [agent_holder]
          guard: Génération courante, échéance changes_due_at non passée.
          effects: Point d'avancement enregistré.
        - id: accept_contract_version
          actors: [agent_holder]
          guard: Comme T02.
          effects: Version figée = nouvelle version.
        - id: request_arbitration
          actors: [agent_holder]
          guard: Conduite continue.
          effects: Demande créée et liée à la tentative.
    - id: T19
      from: changes_requested
      to: submitted
      source: spec
      triggers:
        - id: submit_work
          actors: [agent_holder]
          guard: Comme T03.
          effects: Nouvelle soumission, même génération ; la précédente devient superseded ; T09 si aucun vérificateur éligible.
    - id: T20
      from: changes_requested
      to: accepted
      source: th-009
      triggers:
        - id: approve_submission
          actors: [porteur]
          guard: Motif deliverable_changed, qualification trivial_change explicite, verdict décidé pass sur l'état précédent.
          effects: Soumission rattachée au nouvel état avec la qualification tracée (trivial_from) ; acceptation comme T16.
    - id: T21
      from: changes_requested
      to: expired
      source: th-009
      triggers:
        - id: changes_timeout
          actors: [platform]
          guard: maintenant >= changes_due_at.
          effects: Transition datée de l'échéance ; points d'avancement disponibles.
    - id: T22
      from: changes_requested
      to: released
      source: th-009
      triggers:
        - id: release_mission
          actors: [agent_holder]
          guard: Génération courante.
          effects: Libération motivée ; assignations ouvertes annulées.
        - id: release_attempt
          actors: [contributor_owner, admin]
          guard: Comme T06.
          effects: Libération tracée ; assignations ouvertes annulées.
        - id: request_arbitration
          actors: [agent_holder]
          guard: Conduite stop.
          effects: Comme T06.
        - id: mission_cancelled
          actors: [platform]
          guard: Mission annulée.
          effects: Libération motivée ; assignations ouvertes annulées.
        - id: sibling_accepted
          actors: [platform]
          guard: Mission parallèle, autre tentative acceptée.
          effects: Libération motivée ; assignations ouvertes annulées.
    - id: T23
      from: submitted
