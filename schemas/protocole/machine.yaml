  mission:
    - id: M01
      from: draft
      to: open
      source: spec
      triggers:
        - id: index_contract
          actors: [forge]
          guard: Contrat valide publié (status autre que draft), dépendances satisfaites.
          effects: Mission proposée aux agents.
    - id: M02
      from: draft
      to: blocked
      source: spec
      triggers:
        - id: index_contract
          actors: [forge]
          guard: Contrat valide publié, une dépendance non satisfaite.
          effects: Mission non proposée.
    - id: M03
      from: open
      to: blocked
      source: spec
      triggers:
        - id: index_contract
          actors: [forge]
          guard: Nouvelle version qui ajoute une dépendance non satisfaite.
          effects: Mission non proposée.
    - id: M04
      from: blocked
      to: open
      source: spec
      triggers:
        - id: dependency_integrated
          actors: [forge]
          guard: Toutes les dépendances satisfaites selon leur type (intégration de la mission visée, artefact publié).
          effects: Mission proposée.
    - id: M05
      from: open
      to: in_progress
      source: spec
      triggers:
        - id: claim_mission
          actors: [agent]
          guard: T01.
          effects: Aucun.
    - id: M06
      from: in_progress
      to: open
      source: spec
      triggers:
        - id: attempt_ended
          actors: [platform]
          guard: La dernière tentative active se termine (expired, released, rejected), dépendances satisfaites, aucune demande bloquante ne cite la mission.
          effects: Mission de nouveau proposée ; dernier point d'avancement disponible.
    - id: M07
      from: in_progress
      to: blocked
      source: spec
      triggers:
        - id: attempt_ended
          actors: [platform]
          guard: La dernière tentative active se termine, une dépendance non satisfaite.
          effects: Mission non proposée.
    - id: M08
      from: in_progress
      to: awaiting_decision
      source: spec
      triggers:
        - id: attempt_awaiting_decision
          actors: [agent_holder]
          guard: T04 et aucune autre tentative active hors awaiting_decision.
          effects: Aucun.
        - id: blocking_request
          actors: [agent_holder]
          guard: Conduite stop (T06) avec une demande bloquante qui cite la mission, aucune autre tentative active.
          effects: Réservations refusées (mission_unavailable) jusqu'à la décision.
    - id: M09
      from: awaiting_decision
      to: in_progress
      source: spec
      triggers:
        - id: attempt_resumed
          actors: [agent_holder]
          guard: T07.
          effects: Aucun.
        - id: claim_mission
          actors: [agent]
          guard: Mission parallèle avec une place libre, aucune demande bloquante ne cite la mission.
          effects: Aucun.
    - id: M10
      from: awaiting_decision
      to: open
      source: spec
      triggers:
        - id: attempt_ended
          actors: [platform]
          guard: La tentative awaiting_decision se termine, aucune demande bloquante ne cite la mission, dépendances satisfaites.
          effects: Mission proposée.
        - id: decision_published
          actors: [mandate, admin]
          guard: Décision de la dernière demande bloquante qui cite la mission, aucune tentative active, dépendances satisfaites.
          effects: Mission proposée.
    - id: M11
      from: open
      to: awaiting_decision
      source: spec
      triggers:
        - id: blocking_request
          actors: [human]
          guard: Demande bloquante ouverte qui cite la mission dans blocked_missions.
          effects: Réservations refusées (mission_unavailable).
    - id: M12
      from: in_progress
      to: accepted
      source: spec
      triggers:
        - id: attempt_accepted
          actors: [porteur]
          guard: T16 ou T20.
          effects: Attente de l'intégration par le projet.
    - id: M13
      from: accepted
      to: integrated
      source: spec
      triggers:
        - id: merged
          actors: [forge]
          guard: Fusion ou publication du livrable de la soumission acceptée.
          effects: Événement d'intégration ; état fusionné différent de l'état accepté signalé (merged_state_differs).
    - id: M14
      from: in_progress
      to: integrated
      source: th-009
      triggers:
        - id: merged
          actors: [forge]
          guard: Fusion du livrable d'une soumission non acceptée.
          effects: Intégration signalée integrated_without_acceptance, alerte à la gouvernance ; tentatives actives inchangées, réservations refusées.
    - id: M15
      from: integrated
      to: closed
      source: spec
      triggers:
        - id: record_feedback
          actors: [porteur]
          guard: Retour à 30 jours enregistré.
          effects: Valeur nette alimentée.
        - id: feedback_timeout
          actors: [platform]
          guard: maintenant >= intégration + feedback.after_integration_days + feedback_grace_days.
          effects: Clôture sans retour, signalée.
    - id: M16
      from: draft
      to: cancelled
      source: spec
