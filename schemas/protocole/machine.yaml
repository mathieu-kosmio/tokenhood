          guard: Contrat retiré du dépôt ou passé à status cancelled.
          effects: Comme cancel_mission, motif contract_removed.
    - id: M21
      from: accepted
      to: cancelled
      source: spec
      triggers:
        - id: cancel_mission
          actors: [porteur]
          guard: Motif fourni.
          effects: Tentatives actives libérées (mission_cancelled) ; assignations ouvertes annulées.
        - id: index_contract
          actors: [forge]
          guard: Contrat retiré du dépôt ou passé à status cancelled.
          effects: Comme cancel_mission, motif contract_removed.
    - id: M22
      from: blocked
      to: awaiting_decision
      source: th-009
      triggers:
        - id: blocking_request
          actors: [human]
          guard: Demande bloquante ouverte qui cite la mission (précédence de awaiting_decision sur blocked).
          effects: Aucun.
    - id: M23
      from: awaiting_decision
      to: blocked
      source: th-009
      triggers:
        - id: decision_published
          actors: [mandate, admin]
          guard: Décision de la dernière demande bloquante, aucune tentative active, une dépendance non satisfaite.
          effects: Aucun.
  assignment:
    - id: RV01
      from: null
      to: assigned
      source: spec
      triggers:
        - id: claim_review
          actors: [agent]
          guard: Soumission tirée au sort parmi celles pour lesquelles l'agent est éligible (A5).
          effects: due_at = maintenant + review_assignment_hours ; dossier de revue lié à la version du contrat et au commit ou à l'empreinte.
    - id: RV02
      from: assigned
      to: completed
      source: spec
      triggers:
        - id: submit_review
          actors: [agent_reviewer]
          guard: Rapport conforme à schemas/review-report.schema.json, identifiants et état examiné identiques à ceux de l'assignation.
          effects: Revue valide.
    - id: RV03
      from: assigned
      to: declined
      source: th-009
      triggers:
        - id: decline_review
          actors: [agent_reviewer]
          guard: Motif fourni.
          effects: Soumission de nouveau attribuable, à un autre vérificateur.
    - id: RV04
      from: assigned
      to: expired
      source: th-009
      triggers:
        - id: assignment_timeout
          actors: [platform]
          guard: maintenant >= due_at.
          effects: Transition datée de l'échéance.
    - id: RV05
      from: assigned
      to: cancelled
      source: th-009
      triggers:
        - id: deliverable_changed
          actors: [forge]
          guard: T12, T13 ou T15.
          effects: Aucun rapport accepté sur cette assignation.
        - id: attempt_left_review
          actors: [platform]
          guard: La tentative quitte la revue (released, rejected, changes_requested sur décision du porteur).
          effects: Aucun rapport accepté sur cette assignation.
        - id: mission_cancelled
          actors: [platform]
          guard: Mission annulée.
          effects: Aucun rapport accepté sur cette assignation.

# Règles transverses, citées par les tests (champ rules).
rules:
  - id: G1
    topic: generation
    text: Chaque réservation réussie incrémente la génération de la mission et l'attribue à la nouvelle tentative ; les générations d'une mission sont uniques et strictement croissantes.
  - id: G2
    topic: generation
    text: Toute opération sur une tentative présente son identifiant et sa génération ; une génération différente de celle de la tentative est refusée (stale_generation).
  - id: G3
    topic: generation
    text: Une tentative terminée dont la mission a été réservée depuis (génération supérieure) est périmée ; toute opération est refusée (stale_generation), sans effet.
  - id: G4
    topic: generation
    text: Une tentative expirée non réattribuée répond lease_expired ; une tentative libérée, acceptée ou rejetée répond attempt_closed.
  - id: G5
    topic: generation
    text: La génération ne change ni à la reprise après décision (T07), ni à la nouvelle soumission après changements (T19), ni à la migration de contrat.
  - id: B1
    topic: lease
    text: lease_expires_at = min(maintenant + lease_minutes, deadline_at) à la réservation et à chaque opération qui renouvelle le bail.
  - id: B2
    topic: lease
    text: Une tentative dont lease_expires_at est atteint est expirée pour toute opération, qu'un traitement de fond l'ait enregistré ou non ; l'expiration est datée de lease_expires_at.
  - id: B3
    topic: lease
    text: Une opération reçue à l'instant lease_expires_at exactement arrive trop tard.
  - id: B4
    topic: lease
    text: En awaiting_decision, le bail et la durée active sont suspendus ; à la reprise, deadline_at = reprise + durée active restante.
  - id: B5
    topic: lease
    text: L'horloge de la plateforme fait foi ; toute date est en UTC (RFC 3339) ; l'instant d'une opération est celui de sa transaction.
  - id: V1
    topic: versions
    text: La réservation fige la dernière version valide indexée au moment de la transaction.
  - id: V2
    topic: versions
    text: Un changement compatible laisse la tentative sur sa version figée, sans choix à faire.
  - id: V3
    topic: versions
    text: Un changement incompatible impose un choix avant toute soumission (contract_choice_required) - migrer vers la dernière version ou libérer.
  - id: V4
    topic: versions
    text: La migration vise la dernière version indexée et revérifie l'éligibilité ; sinon contract_version_mismatch ou not_eligible.
  - id: V5
    topic: versions
    text: Une soumission déposée reste liée à sa version figée ; si une version incompatible paraît ensuite, elle est vérifiée contre sa version figée et signalée au porteur (outdated_contract).
  - id: V6
    topic: versions
    text: Classement d'un changement - incompatible s'il touche type, objective, scope, inputs, outputs, acceptance, dependencies, skills, languages, risk, attempts, execution ou verification ; compatible sinon. Le porteur peut déclarer un autre classement, tracé.
  - id: V7
    topic: versions
    text: L'indexation refuse une version inférieure, un contenu modifié sans incrément et un contrat invalide ; la dernière version valide reste en vigueur.
  - id: R1
    topic: resumption
    text: La réponse à claim_mission porte resume_from - le dernier point d'avancement de la tentative expirée ou libérée de plus haute génération qui en a un, avec sa version de contrat.
  - id: R2
    topic: resumption
    text: Les tentatives rejetées et acceptées ne fournissent pas de point de reprise ; sans point disponible, resume_from est absent.
  - id: R3
    topic: resumption
    text: Un point d'avancement est immuable ; son numéro de séquence, attribué par la plateforme, croît d'une unité par tentative.
  - id: I1
    topic: idempotency
    text: Toute écriture porte une clé d'idempotence ; sans clé, idempotency_key_required.
  - id: I2
    topic: idempotency
    text: Une clé déjà vue, de même empreinte (opération et contenu), rejoue la réponse enregistrée sans nouvel effet, même si l'état a changé depuis.
  - id: I3
    topic: idempotency
    text: Une clé déjà vue avec une autre empreinte est refusée (idempotency_conflict) ; la portée d'une clé est le principal appelant, toutes opérations confondues.
  - id: I4
    topic: idempotency
    text: Une requête de même clé encore en cours reçoit idempotency_in_progress, ou la réponse de la première une fois celle-ci terminée.
  - id: I5
    topic: idempotency
    text: Les réponses définitives (succès et erreurs 4xx sauf 409 idempotency_in_progress et 429) sont rejouées ; les erreurs transitoires (5xx, 429) ne sont pas enregistrées.
  - id: I6
    topic: idempotency
    text: Au-delà de idempotency_retention_hours, une clé est oubliée et la requête traitée comme nouvelle.
  - id: C1
    topic: concurrency
    text: Les opérations sur une même mission ou une même tentative sont sérialisables ; le résultat est celui d'un ordre séquentiel quelconque des transactions.
  - id: C2
    topic: concurrency
    text: Une mission exclusive a au plus une tentative active ; une mission parallèle au plus attempts.max ; un agent au plus une tentative active par mission.
  - id: C3
    topic: concurrency
    text: Une soumission a au plus autant d'assignations ouvertes et de revues valides que sa cible.
  - id: C4
    topic: concurrency
    text: Un événement de forge rejoué (même identifiant de livraison) n'a d'effet qu'une fois.
  - id: F1
    topic: eligibility
    text: Plafonds de flux - réservation refusée si les tentatives du projet en production (claimed, awaiting_decision, changes_requested) atteignent max_in_production, ou si les livrables en attente de revue ou d'intégration (submitted, awaiting_reviewer, in_review, missions accepted non intégrées) atteignent max_awaiting_review_or_integration ; la vérification reste proposée.
  - id: F2
    topic: eligibility
    text: Le budget épuisé refuse les nouvelles réservations, jamais les opérations d'une tentative en cours.
  - id: F3
    topic: eligibility
    text: Environnement exigé - execution.environment vm exige un agent déclaré en VM ; container, ou un risque medium ou supérieur, exige un agent en conteneur ou en VM ; any n'exige rien. Sinon not_eligible (environment).
  - id: F4
    topic: eligibility
    text: La suspension d'un projet refuse les nouvelles réservations et assignations de revue ; les tentatives en cours continuent.
  - id: F5
    topic: eligibility
    text: Le projet qui exige un rapport de consommation refuse une soumission qui n'en joint pas.
  - id: W1
    topic: review
    text: Verdict décidé - quand les revues valides de la soumission courante atteignent la cible R (verification.reviewers), un verdict unanime est décidé ; sinon, escalade.
  - id: W2
    topic: review
    text: Escalade - la cible passe à escalation_reviews (R + 1 si R vaut 3 ou plus) ; à la cible, le verdict de majorité stricte est décidé, définitivement ; sans majorité, une demande verification.dispute est ouverte et la tentative reste in_review jusqu'à l'action du porteur.
  - id: W3
    topic: review
    text: Un rejet décidé sans escalade reste en attente pendant contest_window_hours ; le producteur peut le contester une fois (escalade) ; sans contestation, la tentative est rejetée à l'échéance. Un rejet décidé après escalade est immédiat.
  - id: W4
    topic: review
    text: Un vérificateur dont l'assignation a été déclinée ou a expiré n'est plus assigné à la même soumission.
