          state:
            requests: {$r1: {state: open, blocking: false}}
            missions: {DM-001: {state: in_progress}}

  - id: CT-040
    title: Question bloquante, suspension du bail, reprise après décision
    covers: ["T04:request_arbitration", "M08:attempt_awaiting_decision", "T07:heartbeat", "M09:attempt_resumed"]
    rules: [B4, G5]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+20m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k1
        expect: {result: ok, response: {attempt: {lease_expires_at: "+30m"}}}
      - at: "+20m"
        actor: agt_alice
        op: request_arbitration
        input: {attempt: att_0001, generation: 1, request: "@request_switch"}
        key: k2
        expect:
          result: ok
          response: {attempt: {state: awaiting_decision, lease_expires_at: null}}
          save: {r1: request.id}
          state:
            attempts: {att_0001: {state: awaiting_decision, active_minutes: 20}}
            missions: {DM-001: {state: awaiting_decision}}
      - at: "+2h"
        expect:
          state:
            attempts: {att_0001: {state: awaiting_decision}}
      - at: "+2h"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k3
        expect: {result: error, error: decision_pending}
      - at: "+3h"
        actor: user:mia
        op: publish_decision
        input: {request: $r1, option: B}
        key: k4
        expect: {result: ok, state: {requests: {$r1: {state: decided}}}}
      - at: "+3h30m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k5
        expect:
          result: ok
          response: {attempt: {state: claimed, generation: 1, lease_expires_at: "+3h40m", deadline_at: "+4h10m"}}
          state:
            missions: {DM-001: {state: in_progress}}

  - id: CT-041
    title: Délai de reprise écoulé après la décision
    covers: ["T08:resume_timeout", "M10:attempt_ended"]
    rules: [B2, R1]
    given:
      missions: [{id: DM-001, state: awaiting_decision, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: awaiting_decision, generation: 1, claimed_at: "-3h", active_minutes: 20, request: req_0001}
      requests:
        - {id: req_0001, fixture: request_switch, attempt: att_0001, state: decided, decided_at: "+0m"}
      checkpoints:
        - {attempt: att_0001, sequence: 1, summary: Avant la question, recorded_at: "-170m"}
    steps:
      - at: "+71h59m"
        expect:
          state:
            attempts: {att_0001: {state: awaiting_decision}}
      - at: "+72h"
        expect:
          state:
            attempts: {att_0001: {state: released, ended_at: "+72h", reason: resume_timeout}}
            missions: {DM-001: {state: open}}
      - at: "+73h"
        actor: agt_bob
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect: {result: ok, response: {attempt: {generation: 2, resume_from: {attempt: att_0001, checkpoint: {sequence: 1}}}}}

  - id: CT-042
    title: "Arrêt pour une question de sécurité : libération immédiate, mission en attente"
    covers: ["T06:request_arbitration", "M08:blocking_request", "M10:decision_published"]
    rules: [A7]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+5m"
        actor: agt_alice
        op: request_arbitration
        input: {attempt: att_0001, generation: 1, request: {"@": request_stop, blocked_missions: [DM-001]}}
        key: k1
        expect:
          result: ok
          response: {request: {blocking: true, visibility: private}, attempt: {state: released}}
          save: {r1: request.id}
          state:
            attempts: {att_0001: {state: released, reason: stopped}}
            missions: {DM-001: {state: awaiting_decision, active_attempts: 0}}
      - at: "+6m"
        actor: agt_bob
        op: claim_mission
        input: {mission: DM-001}
        key: k2
        expect: {result: error, error: mission_unavailable}
      - at: "+1h"
        actor: user:root
        op: publish_decision
        input: {request: $r1, option: B}
        key: k3
        expect: {result: ok, state: {missions: {DM-001: {state: open}}}}
      - at: "+2h"
        actor: agt_bob
        op: claim_mission
        input: {mission: DM-001}
        key: k4
        expect: {result: ok, response: {attempt: {generation: 2}}}

