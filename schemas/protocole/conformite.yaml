# Tests de conformité du protocole de coordination Tokenhood (mission TH-009).
# Format : schemas/protocol-conformance.schema.json. Conventions de lecture : docs/specs/protocole.md,
# section « Tests de conformité ». Chaque couple transition:déclencheur de schemas/protocole/machine.yaml
# est couvert par au moins un cas (champ covers).
#
# Rappel des conventions :
# - Les dates "+<durée>" sont relatives à t0 (defaults.t0, ou given.t0) : "+90m", "+3h30m", "+14d".
# - "$nom" désigne une valeur enregistrée par save ; "*" une valeur quelconque non nulle ; null une valeur absente ou nulle.
# - "@gabarit" (ou {"@": gabarit, champ: valeur}) désigne un objet de defaults.fixtures, complété ou surchargé.
#   Le harnais complète raised_by (demande d'agent) depuis l'acteur et la tentative de l'étape, et
#   mission, attempt, submission, reviewer_agent, reviewed_state (rapport de revue) depuis l'assignation.
# - response et state se comparent par inclusion : seuls les champs écrits sont vérifiés.
# - Une étape concurrent lance ses opérations au même instant ; le résultat attendu vaut pour tout ordre de sérialisation.
schema_version: "2.1"
suite: coordination
version: 1
machine: schemas/protocole/machine.yaml
document: docs/specs/protocole.md

defaults:
  t0: "2026-11-02T09:00:00Z"
  projects:
    - id: demo
      contract: active
      maintainers: [pat]
      flow_limits: {max_in_production: 10, max_awaiting_review_or_integration: 10}
      usage_report: required
      reciprocal_window: 3
      feedback_days: 30
    - id: autre
      contract: active
      maintainers: [quinn]
      flow_limits: {max_in_production: 10, max_awaiting_review_or_integration: 10}
      usage_report: required
      reciprocal_window: 3
      feedback_days: 30
  users:
    - {id: alice}
    - {id: bob}
    - {id: carol}
    - {id: dan}
    - {id: erin}
    - {id: frank}
    - {id: gina}
    - {id: hugo}
    - {id: pat}
    - {id: quinn}
    - {id: mia, roles: [mandate]}
    - {id: root, roles: [admin]}
  agent:
    capabilities: [docs, code, review]
    languages: [fr, en]
  agents:
    - {id: agt_alice, user: alice, environment: container, model_family: claude}
    - {id: agt_alice2, user: alice, environment: container, model_family: gpt}
    - {id: agt_bob, user: bob, environment: workstation, model_family: gpt}
    - {id: agt_carol, user: carol, environment: container, model_family: gemini}
    - {id: agt_dan, user: dan, environment: vm, model_family: claude}
    - {id: agt_erin, user: erin, environment: container, model_family: mistral}
    - {id: agt_frank, user: frank, environment: container, model_family: gpt}
    - {id: agt_gina, user: gina, environment: container, model_family: gemini}
    - {id: agt_hugo, user: hugo, environment: vm, model_family: claude}
    - {id: agt_pat, user: pat, environment: container, model_family: claude}
  # Une autorisation par agent, nommée aut_<agent sans préfixe> (aut_alice, aut_alice2…).
  authorization:
    projects: [demo]
    mission_types: any
    review: true
    max_concurrent: 3
    budget: {unit: missions, value: 10}
    expires_at: "+30d"
  mission:
    project: demo
    version: 1
    type: docs
    state: open
    generation: 0
    attempts: {mode: exclusive}
    max_lease_minutes: 60
    risk: low
    environment: any
    reviewers: 1
    dependencies: []
  fixtures:
    pr: {kind: pull_request, url: "https://github.com/exemple/demo/pull/1", commit: c0ffee1}
    usage:
      schema_version: "2.1"
      missions: [DM-001]
      contribution: {kind: production}
      contributor: exemple
      agent: {client: claude-code, model_family: claude, model: claude-opus-5-5}
      period: {start: "2026-11-02T09:00:00Z", end: "2026-11-02T09:30:00Z"}
      tokens: {input: 100, output: 2000, cache_creation: 30000, cache_read: 400000}
      counted: 32100
      method: client_transcript
      nature: declared
      evidence: Transcription du client.
    request_continue:
      schema_version: "2.1"
      type: spec.clarification
      category: 1
      title: {fr: Valeur par défaut, en: Default value}
      context: Le contrat ne fixe pas cette valeur.
      options:
        - {id: A, label: Garder la valeur actuelle, impact: Aucun, reversible: true}
        - {id: B, label: Changer la valeur, impact: Mineur, reversible: true}
      default_option: A
      conduct: continue
      blocking: false
    request_switch:
      schema_version: "2.1"
      type: architecture.choice
      category: 2
      title: {fr: Format consommé, en: Consumed format}
      context: L'option par défaut changerait un format déjà consommé.
      options:
        - {id: A, label: Changer le format, impact: Migration des consommateurs, reversible: false}
        - {id: B, label: Garder le format, impact: Livrable partiel, reversible: true}
      default_option: B
      conduct: switch_mission
      blocking: true
    request_stop:
      schema_version: "2.1"
      type: security.emergency
      category: null
      title: {fr: Secret dans l'historique, en: Secret in history}
      context: Un jeton apparaît dans l'historique du dépôt ; sa valeur n'est pas recopiée.
      options:
        - {id: A, label: Révoquer puis réécrire l'historique, impact: Irréversible, reversible: false}
        - {id: B, label: Révoquer seulement, impact: Jeton inutilisable, reversible: false}
      default_option: B
      conduct: stop
      blocking: true
      urgency: high
    request_human:
      schema_version: "2.1"
      type: spec.clarification
      category: 1
      raised_by: {kind: human, user: pat}
      title: {fr: Périmètre à préciser, en: Scope to clarify}
      context: Deux entrées se contredisent.
      options:
        - {id: A, label: Suivre la première entrée, impact: Aucun, reversible: true}
        - {id: B, label: Suivre la seconde entrée, impact: Aucun, reversible: true}
      default_option: A
      blocking: true
    report_pass:
      schema_version: "2.1"
      verdict: pass
      criteria: [{requirement: Exigence 1, result: pass, evidence: Vérifiée sur le livrable}]
      tests: []
      risks: []
      limits: {not_verified: [], uncertain: []}
    report_changes:
      schema_version: "2.1"
      verdict: changes_requested
      criteria: [{requirement: Exigence 1, result: fail, evidence: Section manquante}]
      tests: []
      risks: []
      limits: {not_verified: [], uncertain: []}
    report_reject:
      schema_version: "2.1"
      verdict: reject
      criteria: [{requirement: Exigence 1, result: fail, evidence: Livrable hors sujet}]
      tests: []
      risks: []
      limits: {not_verified: [], uncertain: []}
      remarks: Le livrable ne répond pas à l'objectif.

cases:
  # ---------------------------------------------------------------- Réservation, bail, reprise
  - id: CT-001
    title: Réservation d'une mission exclusive ouverte
    covers: ["T01:claim_mission", "M05:claim_mission"]
    rules: [G1, B1, V1, R2]
    given:
      missions: [{id: DM-001}]
    steps:
      - at: "+0m"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect:
          result: ok
          response:
            attempt: {mission: DM-001, contract_version: 1, generation: 1, state: claimed, lease_expires_at: "+10m", deadline_at: "+60m", budget: "*", resume_from: null}
          save: {a1: attempt.id}
          state:
            missions: {DM-001: {state: in_progress, generation: 1, active_attempts: 1}}
            attempts: {$a1: {state: claimed, generation: 1, contract_version: 1}}

  - id: CT-002
    title: Heartbeat et points d'avancement renouvellent le bail
    covers: ["T02:heartbeat", "T02:report_progress"]
    rules: [B1, R3]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+7m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k1
        expect:
          result: ok
          response: {attempt: {state: claimed, generation: 1, lease_expires_at: "+17m", deadline_at: "+60m"}}
      - at: "+12m"
        actor: agt_alice
        op: report_progress
        input: {attempt: att_0001, generation: 1, checkpoint: {summary: Plan du document rédigé}}
        key: k2
        expect:
          result: ok
          response: {checkpoint: {sequence: 1, recorded_at: "+12m"}, attempt: {lease_expires_at: "+22m"}}
      - at: "+15m"
        actor: agt_alice
        op: report_progress
        input: {attempt: att_0001, generation: 1, checkpoint: {summary: Sections 1 et 2 rédigées, ref: {branch: dm-001, commit: a1b2c3d}}}
        key: k3
        expect:
          result: ok
          response: {checkpoint: {sequence: 2}, attempt: {lease_expires_at: "+25m"}}
          state:
            attempts: {att_0001: {state: claimed, checkpoints: 2}}

  - id: CT-003
    title: Le bail ne dépasse jamais le plafond de durée active
    covers: ["T05:lease_timeout", "M06:attempt_ended"]
    rules: [B1, B2]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1, max_lease_minutes: 30}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+30m"}
    steps:
      - at: "+9m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k1
        expect: {result: ok, response: {attempt: {lease_expires_at: "+19m"}}}
      - at: "+18m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k2
        expect: {result: ok, response: {attempt: {lease_expires_at: "+28m"}}}
      - at: "+25m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k3
        expect: {result: ok, response: {attempt: {lease_expires_at: "+30m", deadline_at: "+30m"}}}
      - at: "+29m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k4
        expect: {result: ok, response: {attempt: {lease_expires_at: "+30m"}}}
      - at: "+30m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k5
        expect:
          result: error
          error: lease_expired
          state:
            attempts: {att_0001: {state: expired, ended_at: "+30m"}}
            missions: {DM-001: {state: open, active_attempts: 0}}

  - id: CT-004
    title: Une opération reçue à l'échéance exacte du bail arrive trop tard
    covers: ["T05:lease_timeout"]
    rules: [B2, B3, B5, G4]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+10m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k1
        expect:
          result: error
          error: lease_expired
          state:
            attempts: {att_0001: {state: expired, ended_at: "+10m"}}
      - at: "+11m"
        actor: agt_alice
        op: report_progress
        input: {attempt: att_0001, generation: 1, checkpoint: {summary: Trop tard}}
        key: k2
        expect:
          result: error
          error: lease_expired
          state:
            attempts: {att_0001: {checkpoints: 0}}
            missions: {DM-001: {state: open}}

  - id: CT-005
    title: Libération par l'agent avec un point d'avancement final, reprise par un autre agent
    covers: ["T06:release_mission", "M06:attempt_ended", "T01:claim_mission"]
    rules: [R1, G1, G4]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+5m"
        actor: agt_alice
        op: release_mission
        input: {attempt: att_0001, generation: 1, reason: Capacité épuisée, checkpoint: {summary: Section 3 à reprendre, ref: {branch: dm-001, commit: a1b2c3d}}}
        key: k1
        expect:
          result: ok
          response: {attempt: {state: released}}
          state:
            attempts: {att_0001: {state: released, ended_at: "+5m", checkpoints: 1}}
            missions: {DM-001: {state: open, active_attempts: 0}}
      - at: "+6m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k2
        expect: {result: error, error: attempt_closed}
      - at: "+7m"
        actor: agt_bob
        op: claim_mission
        input: {mission: DM-001}
        key: k3
        expect:
          result: ok
          response:
            attempt:
              generation: 2
              resume_from: {attempt: att_0001, generation: 1, contract_version: 1, checkpoint: {sequence: 1, summary: Section 3 à reprendre}}

  - id: CT-006
    title: Reprise du dernier point d'avancement après expiration
    covers: ["T01:claim_mission"]
    rules: [R1, R3]
    given:
      missions: [{id: DM-001, state: open, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: expired, generation: 1, ended_at: "-1h"}
      checkpoints:
        - {attempt: att_0001, sequence: 1, summary: Plan rédigé, recorded_at: "-90m"}
        - {attempt: att_0001, sequence: 2, summary: Sections 1 et 2 rédigées, recorded_at: "-75m"}
    steps:
      - at: "+0m"
        actor: agt_bob
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect:
          result: ok
          response:
            attempt:
              generation: 2
              resume_from: {attempt: att_0001, generation: 1, checkpoint: {sequence: 2, summary: Sections 1 et 2 rédigées}}

  - id: CT-007
    title: Une tentative rejetée ne fournit pas de point de reprise
    covers: ["T01:claim_mission"]
    rules: [R1, R2]
    given:
      missions:
        - {id: DM-001, state: open, generation: 2}
        - {id: DM-002, state: open, generation: 1}
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: expired, generation: 1, ended_at: "-2d"}
        - {id: att_0002, mission: DM-001, agent: agt_bob, state: rejected, generation: 2, ended_at: "-1d"}
        - {id: att_0003, mission: DM-002, agent: agt_bob, state: rejected, generation: 1, ended_at: "-1d"}
      checkpoints:
        - {attempt: att_0001, sequence: 1, summary: Premier jet, recorded_at: "-2d"}
        - {attempt: att_0002, sequence: 1, summary: Version rejetée, recorded_at: "-30h"}
        - {attempt: att_0003, sequence: 1, summary: Version rejetée, recorded_at: "-30h"}
    steps:
      - at: "+0m"
        actor: agt_carol
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect:
          result: ok
          response: {attempt: {generation: 3, resume_from: {attempt: att_0001, generation: 1, checkpoint: {summary: Premier jet}}}}
      - at: "+1m"
        actor: agt_carol
        op: claim_mission
        input: {mission: DM-002}
        key: k2
        expect:
          result: ok
          response: {attempt: {generation: 2, resume_from: null}}

  # ---------------------------------------------------------------- Générations
  - id: CT-008
    title: Le même agent re-réserve sa mission expirée ; l'ancienne génération est périmée
    covers: ["T01:claim_mission"]
    rules: [G1, G3, R1]
    given:
      missions: [{id: DM-001, state: open, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: expired, generation: 1, ended_at: "-5m"}
      checkpoints:
        - {attempt: att_0001, sequence: 1, summary: Brouillon, recorded_at: "-12m"}
    steps:
      - at: "+0m"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect:
          result: ok
          response: {attempt: {generation: 2, resume_from: {attempt: att_0001, generation: 1}}}
          save: {a2: attempt.id}
      - at: "+1m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k2
        expect:
          result: error
          error: stale_generation
          state:
            attempts: {$a2: {state: claimed, generation: 2}}

  - id: CT-009
    title: Aucune opération d'une génération périmée n'a d'effet
    covers: []
    rules: [G3, C2]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 2}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: expired, generation: 1, ended_at: "-5m"}
        - {id: att_0002, mission: DM-001, agent: agt_bob, state: claimed, generation: 2, claimed_at: "-3m", lease_expires_at: "+7m", deadline_at: "+57m"}
      checkpoints:
        - {attempt: att_0001, sequence: 1, summary: Brouillon, recorded_at: "-20m"}
    steps:
      - at: "+0m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k1
        expect: {result: error, error: stale_generation}
      - at: "+0m"
        actor: agt_alice
        op: report_progress
        input: {attempt: att_0001, generation: 1, checkpoint: {summary: Suite}}
        key: k2
        expect: {result: error, error: stale_generation}
      - at: "+0m"
        actor: agt_alice
        op: submit_work
        input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}
        key: k3
        expect: {result: error, error: stale_generation}
      - at: "+0m"
        actor: agt_alice
        op: accept_contract_version
        input: {attempt: att_0001, generation: 1, version: 1}
        key: k4
        expect: {result: error, error: stale_generation}
      - at: "+0m"
        actor: agt_alice
        op: request_arbitration
        input: {attempt: att_0001, generation: 1, request: "@request_continue"}
        key: k5
        expect: {result: error, error: stale_generation}
      - at: "+0m"
        actor: agt_alice
        op: release_mission
        input: {attempt: att_0001, generation: 1, reason: Abandon}
        key: k6
        expect:
          result: error
          error: stale_generation
          state:
            attempts:
              att_0001: {state: expired, checkpoints: 1, submissions: 0}
              att_0002: {state: claimed, generation: 2}
            missions: {DM-001: {state: in_progress, generation: 2, active_attempts: 1}}

  - id: CT-010
    title: Une génération différente de celle de la tentative est refusée
    covers: ["T02:heartbeat"]
    rules: [G2]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 3}]
      attempts:
        - {id: att_0003, mission: DM-001, agent: agt_alice, state: claimed, generation: 3, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+1m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0003, generation: 2}
        key: k1
        expect: {result: error, error: stale_generation}
      - at: "+1m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0003, generation: 4}
        key: k2
        expect: {result: error, error: stale_generation}
      - at: "+1m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0003, generation: 0}
        key: k3
        expect: {result: error, error: invalid_request}
      - at: "+2m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0003, generation: 3}
        key: k4
        expect: {result: ok, response: {attempt: {lease_expires_at: "+12m"}}}

  - id: CT-011
    title: Un agent ne voit pas la tentative d'un autre agent
    covers: []
    rules: [A3]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+1m"
        actor: agt_bob
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k1
        expect: {result: error, error: attempt_not_found}
      - at: "+1m"
        actor: agt_bob
        op: release_mission
        input: {attempt: att_0001, generation: 1, reason: Essai}
        key: k2
        expect:
          result: error
          error: attempt_not_found
          state:
            attempts: {att_0001: {state: claimed, lease_expires_at: "+10m"}}

  - id: CT-012
    title: Une tentative close répond attempt_closed
    covers: []
    rules: [G4]
    given:
      missions:
        - {id: DM-001, state: open, generation: 1}
        - {id: DM-002, state: accepted, generation: 1}
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: released, generation: 1, ended_at: "-1h"}
        - {id: att_0002, mission: DM-002, agent: agt_alice, state: accepted, generation: 1, ended_at: "-1h"}
    steps:
      - at: "+0m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k1
        expect: {result: error, error: attempt_closed}
      - at: "+0m"
        actor: agt_alice
        op: report_progress
        input: {attempt: att_0002, generation: 1, checkpoint: {summary: Après coup}}
        key: k2
        expect: {result: error, error: attempt_closed}

  # ---------------------------------------------------------------- Concurrence
  - id: CT-013
    title: Réservations concurrentes d'une mission exclusive
    covers: ["T01:claim_mission", "M05:claim_mission"]
    rules: [C1, C2, G1]
    given:
      missions: [{id: DM-001}]
    steps:
      - at: "+0m"
        concurrent:
          - {actor: agt_alice, op: claim_mission, input: {mission: DM-001}, key: k1}
          - {actor: agt_bob, op: claim_mission, input: {mission: DM-001}, key: k2}
          - {actor: agt_carol, op: claim_mission, input: {mission: DM-001}, key: k3}
          - {actor: agt_dan, op: claim_mission, input: {mission: DM-001}, key: k4}
          - {actor: agt_erin, op: claim_mission, input: {mission: DM-001}, key: k5}
        expect:
          ok: 1
          errors: {mission_already_claimed: 4}
          state:
            missions: {DM-001: {state: in_progress, generation: 1, active_attempts: 1}}

  - id: CT-014
    title: Réservations concurrentes d'une mission parallèle
    covers: ["T01:claim_mission"]
    rules: [C1, C2, G1]
    given:
      missions: [{id: DM-001, attempts: {mode: parallel, max: 2}}]
    steps:
      - at: "+0m"
        concurrent:
          - {actor: agt_alice, op: claim_mission, input: {mission: DM-001}, key: k1}
          - {actor: agt_bob, op: claim_mission, input: {mission: DM-001}, key: k2}
          - {actor: agt_carol, op: claim_mission, input: {mission: DM-001}, key: k3}
          - {actor: agt_dan, op: claim_mission, input: {mission: DM-001}, key: k4}
          - {actor: agt_erin, op: claim_mission, input: {mission: DM-001}, key: k5}
        expect:
          ok: 2
          errors: {mission_already_claimed: 3}
          state:
            missions: {DM-001: {state: in_progress, generation: 2, active_attempts: 2}}

  - id: CT-015
    title: Réservation et heartbeat concurrents à l'échéance du bail
    covers: ["T01:claim_mission", "T05:lease_timeout"]
    rules: [C1, B2, G3]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+10m"
        concurrent:
          - {label: reservation, actor: agt_bob, op: claim_mission, input: {mission: DM-001}, key: k1}
          - {label: battement, actor: agt_alice, op: heartbeat, input: {attempt: att_0001, generation: 1}, key: k2}
        expect:
          results:
            reservation: {result: ok, response: {attempt: {generation: 2}}}
            battement: {result: error, error_in: [lease_expired, stale_generation]}
          state:
            attempts: {att_0001: {state: expired, ended_at: "+10m"}}
            missions: {DM-001: {state: in_progress, generation: 2, active_attempts: 1}}

  - id: CT-016
    title: Soumission juste avant et à l'échéance du bail
    covers: ["T03:submit_work", "T05:lease_timeout"]
    rules: [B3, C1]
    given:
      missions:
        - {id: DM-001, state: in_progress, generation: 1}
        - {id: DM-002, state: in_progress, generation: 1}
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
        - {id: att_0002, mission: DM-002, agent: agt_bob, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+9m59s"
        actor: agt_alice
        op: submit_work
        input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}
        key: k1
        expect:
          result: ok
          response: {submission: {id: "*", contract_version: 1, commit: c0ffee1}, attempt: {state: submitted}}
      - at: "+10m"
        actor: agt_bob
        op: submit_work
        input: {attempt: att_0002, generation: 1, contract_version: 1, deliverable: {"@": pr, url: "https://github.com/exemple/demo/pull/2"}, usage_report: "@usage"}
        key: k2
        expect:
          result: error
          error: lease_expired
          state:
            attempts:
              att_0001: {state: submitted}
              att_0002: {state: expired, submissions: 0}

  - id: CT-017
    title: Deux soumissions concurrentes d'une même tentative
    covers: ["T03:submit_work"]
    rules: [C1]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+5m"
        concurrent:
          - {actor: agt_alice, op: submit_work, input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}, key: k1}
          - {actor: agt_alice, op: submit_work, input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}, key: k2}
        expect:
          ok: 1
          errors: {invalid_transition: 1}
          state:
            attempts: {att_0001: {state: submitted, submissions: 1}}

  - id: CT-018
    title: Libération et heartbeat concurrents
    covers: ["T06:release_mission"]
    rules: [C1]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+5m"
        concurrent:
          - {label: liberation, actor: agt_alice, op: release_mission, input: {attempt: att_0001, generation: 1, reason: Fin}, key: k1}
          - {label: battement, actor: agt_alice, op: heartbeat, input: {attempt: att_0001, generation: 1}, key: k2}
        expect:
          results:
            liberation: {result: ok}
            battement: {result_in: [ok, error], error_in: [attempt_closed]}
          state:
            attempts: {att_0001: {state: released}}
            missions: {DM-001: {state: open}}

  - id: CT-019
    title: Deux vérificateurs pour une seule place de revue
    covers: ["T10:claim_review", "RV01:claim_review"]
    rules: [C1, C3]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: submitted, generation: 1}
      submissions:
        - {id: SUB-001, attempt: att_0001, state: current, commit: c0ffee1, contract_version: 1, submitted_at: "-1h"}
    steps:
      - at: "+0m"
        concurrent:
          - {actor: agt_carol, op: claim_review, input: {}, key: k1}
          - {actor: agt_dan, op: claim_review, input: {}, key: k2}
        expect:
          ok: 2
          state:
            attempts: {att_0001: {state: in_review}}
            submissions: {SUB-001: {open_assignments: 1}}

  - id: CT-020
    title: Décision publiée pendant la libération de la tentative en attente
    covers: ["T08:release_mission"]
    rules: [C1]
    given:
      missions: [{id: DM-001, state: awaiting_decision, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: awaiting_decision, generation: 1, claimed_at: "-2h", active_minutes: 20, request: req_0001}
      requests:
        - {id: req_0001, fixture: request_switch, attempt: att_0001, state: open}
    steps:
      - at: "+0m"
        concurrent:
          - {actor: user:mia, op: publish_decision, input: {request: req_0001, option: B}, key: k1}
          - {actor: agt_alice, op: release_mission, input: {attempt: att_0001, generation: 1, reason: Autre priorité}, key: k2}
        expect:
          ok: 2
          state:
            attempts: {att_0001: {state: released}}
            requests: {req_0001: {state: decided}}
            missions: {DM-001: {state: open}}

  - id: CT-021
    title: Version incompatible indexée pendant une soumission
    covers: ["T03:submit_work"]
    rules: [C1, V3, V5]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+5m"
        concurrent:
          - {label: indexation, actor: forge, op: index_contract, input: {delivery: d1, missions: [{id: DM-001, version: 2, changes: [acceptance]}]}, key: d1}
          - {label: soumission, actor: agt_alice, op: submit_work, input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}, key: k1}
        expect:
          one_of:
            - results: {indexation: {result: ok}, soumission: {result: ok}}
              state:
                attempts: {att_0001: {state: submitted, contract_version: 1}}
                missions: {DM-001: {version: 2}}
            - results: {indexation: {result: ok}, soumission: {result: error, error: contract_choice_required}}
              state:
                attempts: {att_0001: {state: claimed, contract: {frozen_version: 1, latest_version: 2, choice_required: true}}}

  - id: CT-022
    title: Approbation concurrente d'une modification du livrable
    covers: ["T16:approve_submission", "T15:deliverable_changed"]
    rules: [C1]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: in_review, generation: 1}
      submissions:
        - {id: SUB-001, attempt: att_0001, state: current, commit: c0ffee1, contract_version: 1, decided_verdict: pass, approval: pending}
      reviews:
        - {submission: SUB-001, agent: agt_carol, verdict: pass, commit: c0ffee1, state: valid}
    steps:
      - at: "+0m"
        concurrent:
          - {label: approbation, actor: user:pat, op: approve_submission, input: {submission: SUB-001}, if_match: current, key: k1}
          - {label: modification, actor: forge, op: deliverable_changed, input: {delivery: d1, submission: SUB-001, commit: beef002}, key: d1}
        expect:
          one_of:
            - results: {approbation: {result: ok}}
              state:
                attempts: {att_0001: {state: accepted}}
                missions: {DM-001: {state: accepted}}
            - results: {approbation: {result: error, error_in: [precondition_failed, invalid_transition]}}
              state:
                attempts: {att_0001: {state: changes_requested, reason: deliverable_changed}}
                missions: {DM-001: {state: in_progress}}

  - id: CT-023
    title: Un événement de fusion rejoué n'a d'effet qu'une fois
    covers: ["M13:merged"]
    rules: [C4]
    given:
      missions: [{id: DM-001, state: accepted, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: accepted, generation: 1}
      submissions:
        - {id: SUB-001, attempt: att_0001, state: accepted, commit: c0ffee1, contract_version: 1}
    steps:
      - at: "+0m"
        actor: forge
        op: merged
        input: {delivery: d1, submission: SUB-001, commit: c0ffee1}
        key: d1
        expect: {result: ok}
      - at: "+1m"
        actor: forge
        op: merged
        input: {delivery: d1, submission: SUB-001, commit: c0ffee1}
        key: d1
        expect:
          result: ok
          state:
            missions: {DM-001: {state: integrated, integration_events: 1}}

  # ---------------------------------------------------------------- Idempotence
  - id: CT-024
    title: Rejeu d'une réservation avec la même clé
    covers: ["T01:claim_mission"]
    rules: [I2]
    given:
      missions: [{id: DM-001}]
    steps:
      - at: "+0m"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect:
          result: ok
          save: {a1: attempt.id}
      - at: "+1m"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect:
          result: ok
          response: {attempt: {id: $a1, generation: 1, lease_expires_at: "+10m"}}
          state:
            missions: {DM-001: {generation: 1, active_attempts: 1}}

  - id: CT-025
    title: Une clé réutilisée pour une autre requête est refusée
    covers: []
    rules: [I3]
    given:
      missions:
        - {id: DM-001}
        - {id: DM-002}
    steps:
      - at: "+0m"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect: {result: ok, save: {a1: attempt.id}}
      - at: "+1m"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-002}
        key: k1
        expect: {result: error, error: idempotency_conflict}
      - at: "+2m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: $a1, generation: 1}
        key: k1
        expect:
          result: error
          error: idempotency_conflict
          state:
            missions: {DM-002: {state: open, generation: 0}}
            attempts: {$a1: {lease_expires_at: "+10m"}}

  - id: CT-026
    title: Une écriture sans clé est refusée, une lecture n'en demande pas
    covers: []
    rules: [I1]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+1m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        expect:
          result: error
          error: idempotency_key_required
          state:
            attempts: {att_0001: {lease_expires_at: "+10m"}}
      - at: "+1m"
        actor: agt_alice
        op: get_status
        input: {}
        expect: {result: ok}

  - id: CT-027
    title: Une erreur définitive est rejouée avec sa clé
    covers: ["T06:release_mission", "M06:attempt_ended"]
    rules: [I2, I5]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+1m"
        actor: agt_bob
        op: claim_mission
        input: {mission: DM-001}
        key: k7
        expect: {result: error, error: mission_already_claimed}
      - at: "+2m"
        actor: agt_alice
        op: release_mission
        input: {attempt: att_0001, generation: 1, reason: Fin}
        key: k1
        expect: {result: ok, state: {missions: {DM-001: {state: open}}}}
      - at: "+3m"
        actor: agt_bob
        op: claim_mission
        input: {mission: DM-001}
        key: k7
        expect: {result: error, error: mission_already_claimed}
      - at: "+4m"
        actor: agt_bob
        op: claim_mission
        input: {mission: DM-001}
        key: k8
        expect: {result: ok, response: {attempt: {generation: 2}}}

  - id: CT-028
    title: Deux requêtes simultanées de même clé
    covers: ["T01:claim_mission"]
    rules: [I4, C1]
    given:
      missions: [{id: DM-001}]
    steps:
      - at: "+0m"
        concurrent:
          - {actor: agt_alice, op: claim_mission, input: {mission: DM-001}, key: k1}
          - {actor: agt_alice, op: claim_mission, input: {mission: DM-001}, key: k1}
        expect:
          one_of:
            - {ok: 2, same_response: true}
            - {ok: 1, errors: {idempotency_in_progress: 1}}
          state:
            missions: {DM-001: {generation: 1, active_attempts: 1}}

  - id: CT-029
    title: Au-delà de la rétention, une clé est oubliée
    covers: ["T01:claim_mission", "T06:release_mission"]
    rules: [I2, I6]
    given:
      missions: [{id: DM-001}]
    steps:
      - at: "+0m"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect: {result: ok, save: {a1: attempt.id}}
      - at: "+5m"
        actor: agt_alice
        op: release_mission
        input: {attempt: $a1, generation: 1, reason: Fin}
        key: k2
        expect: {result: ok}
      - at: "+2h"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect:
          result: ok
          response: {attempt: {id: $a1, generation: 1}}
          state:
            missions: {DM-001: {state: open, generation: 1}}
      - at: "+25h"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect:
          result: ok
          response: {attempt: {generation: 2}}
          state:
            missions: {DM-001: {state: in_progress, generation: 2}}

  # ---------------------------------------------------------------- Versions du contrat
  - id: CT-030
    title: Changement compatible pendant une tentative
    covers: ["T02:heartbeat", "T03:submit_work"]
    rules: [V2, V6]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+5m"
        actor: forge
        op: index_contract
        input: {delivery: d1, missions: [{id: DM-001, version: 2, changes: [priority, title]}]}
        key: d1
        expect: {result: ok, response: {missions: [{id: DM-001, version: 2, classification: compatible}]}}
      - at: "+6m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k1
        expect:
          result: ok
          response: {contract: {frozen_version: 1, latest_version: 2, change: compatible, choice_required: false}}
      - at: "+7m"
        actor: agt_alice
        op: submit_work
        input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}
        key: k2
        expect:
          result: ok
          response: {submission: {contract_version: 1, outdated_contract: false}}

  - id: CT-031
    title: Changement incompatible, choix imposé, migration
    covers: ["T02:accept_contract_version", "T03:submit_work"]
    rules: [V3, V4, V6, G5]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+5m"
        actor: forge
        op: index_contract
        input: {delivery: d1, missions: [{id: DM-001, version: 2, changes: [acceptance]}]}
        key: d1
        expect: {result: ok, response: {missions: [{id: DM-001, classification: incompatible}]}}
      - at: "+6m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k1
        expect: {result: ok, response: {contract: {frozen_version: 1, latest_version: 2, change: incompatible, choice_required: true}}}
      - at: "+7m"
        actor: agt_alice
        op: submit_work
        input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}
        key: k2
        expect: {result: error, error: contract_choice_required}
      - at: "+8m"
        actor: agt_alice
        op: accept_contract_version
        input: {attempt: att_0001, generation: 1, version: 2}
        key: k3
        expect:
          result: ok
          response: {attempt: {contract_version: 2, generation: 1, lease_expires_at: "+18m", deadline_at: "+60m"}}
      - at: "+9m"
        actor: agt_alice
        op: submit_work
        input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}
        key: k4
        expect: {result: error, error: contract_version_mismatch}
      - at: "+10m"
        actor: agt_alice
        op: submit_work
        input: {attempt: att_0001, generation: 1, contract_version: 2, deliverable: "@pr", usage_report: "@usage"}
        key: k5
        expect: {result: ok, response: {submission: {contract_version: 2}}, state: {attempts: {att_0001: {state: submitted, generation: 1}}}}

  - id: CT-032
    title: La migration vise la dernière version indexée
    covers: ["T02:accept_contract_version"]
    rules: [V4]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+2m"
        actor: forge
        op: index_contract
        input: {delivery: d1, missions: [{id: DM-001, version: 2, changes: [acceptance]}]}
        key: d1
        expect: {result: ok}
      - at: "+3m"
        actor: forge
        op: index_contract
        input: {delivery: d2, missions: [{id: DM-001, version: 3, changes: [scope]}]}
        key: d2
        expect: {result: ok}
      - at: "+4m"
        actor: agt_alice
        op: accept_contract_version
        input: {attempt: att_0001, generation: 1, version: 2}
        key: k1
        expect: {result: error, error: contract_version_mismatch}
      - at: "+5m"
        actor: agt_alice
        op: accept_contract_version
        input: {attempt: att_0001, generation: 1, version: 3}
        key: k2
        expect: {result: ok, response: {attempt: {contract_version: 3}}}
      - at: "+6m"
        actor: agt_alice
        op: accept_contract_version
        input: {attempt: att_0001, generation: 1, version: 3}
        key: k3
        expect: {result: error, error: contract_version_mismatch}
      - at: "+7m"
        actor: agt_alice
        op: submit_work
        input: {attempt: att_0001, generation: 1, contract_version: 3, deliverable: "@pr", usage_report: "@usage"}
        key: k4
        expect: {result: ok, state: {attempts: {att_0001: {state: submitted, contract_version: 3}}}}

  - id: CT-033
    title: Migration refusée faute d'éligibilité, puis libération
    covers: ["T06:release_mission"]
    rules: [V4, F3]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_bob, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+2m"
        actor: forge
        op: index_contract
        input: {delivery: d1, missions: [{id: DM-001, version: 2, changes: [execution], set: {environment: container}}]}
        key: d1
        expect: {result: ok, response: {missions: [{id: DM-001, classification: incompatible}]}}
      - at: "+3m"
        actor: agt_bob
        op: accept_contract_version
        input: {attempt: att_0001, generation: 1, version: 2}
        key: k1
        expect: {result: error, error: not_eligible, response: {error: {details: {reasons: [environment]}}}}
      - at: "+4m"
        actor: agt_bob
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k2
        expect: {result: ok, response: {contract: {frozen_version: 1, latest_version: 2, choice_required: true}}}
      - at: "+5m"
        actor: agt_bob
        op: release_mission
        input: {attempt: att_0001, generation: 1, reason: Environnement isolé exigé par la version 2}
        key: k3
        expect: {result: ok, state: {attempts: {att_0001: {state: released}}}}

  - id: CT-034
    title: Une soumission déposée reste liée à sa version
    covers: ["T10:claim_review", "RV01:claim_review"]
    rules: [V5]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: submitted, generation: 1}
      submissions:
        - {id: SUB-001, attempt: att_0001, state: current, commit: c0ffee1, contract_version: 1, submitted_at: "-10m"}
    steps:
      - at: "+0m"
        actor: forge
        op: index_contract
        input: {delivery: d1, missions: [{id: DM-001, version: 2, changes: [acceptance]}]}
        key: d1
        expect:
