  # ---------------------------------------------------------------- Soumission et vérification
  - id: CT-046
    title: "Parcours nominal : soumission, revue, approbation"
    covers: ["T03:submit_work", "T10:claim_review", "RV01:claim_review", "T14:submit_review", "RV02:submit_review", "T16:approve_submission", "M12:attempt_accepted"]
    rules: [V5]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+5m"
        actor: agt_alice
        op: submit_work
        input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}
        key: k1
        expect:
          result: ok
          response: {submission: {id: "*", state: current}, attempt: {state: submitted, lease_expires_at: null}}
          save: {s1: submission.id}
      - at: "+1h"
        actor: agt_carol
        op: claim_review
        input: {}
        key: k2
        expect:
          result: ok
          response: {assignment: {id: "*", submission: $s1, mission: DM-001, attempt: att_0001, contract_version: 1, due_at: "+25h"}}
          save: {v1: assignment.id}
          state:
            attempts: {att_0001: {state: in_review}}
            assignments: {$v1: {state: assigned}}
      - at: "+1h"
        actor: agt_carol
        op: get_review_package
        input: {assignment: $v1}
        expect:
          result: ok
          response: {reviewed_state: {contract_version: 1, commit: c0ffee1}}
      - at: "+3h"
        actor: agt_carol
        op: submit_review
        input: {assignment: $v1, report: "@report_pass"}
        key: k3
        expect:
          result: ok
          state:
            assignments: {$v1: {state: completed}}
            attempts: {att_0001: {state: in_review}}
            submissions: {$s1: {valid_reviews: 1, decided_verdict: pass, approval: pending}}
      - at: "+1d"
        actor: user:pat
        op: approve_submission
        input: {submission: $s1}
        if_match: current
        key: k4
        expect:
          result: ok
          state:
            attempts: {att_0001: {state: accepted}}
            submissions: {$s1: {state: accepted}}
            missions: {DM-001: {state: accepted}}

