      - {at: "+0m", actor: agt_carol, entry: rest, op: reject_submission, input: {submission: SUB-001, reason: Essai}, key: k3, expect: {result: error, error: forbidden_role}}
      - {at: "+0m", actor: agt_carol, entry: rest, op: cancel_mission, input: {mission: DM-001, reason: Essai}, key: k4, expect: {result: error, error: forbidden_role}}
      - {at: "+0m", actor: agt_carol, entry: rest, op: declare_contract_compatibility, input: {mission: DM-001, version: 1, classification: compatible, reason: Essai}, key: k5, expect: {result: error, error: forbidden_role}}
      - {at: "+0m", actor: agt_carol, entry: rest, op: publish_decision, input: {request: req_0009, option: A}, key: k6, expect: {result: error, error: forbidden_role}}
      - {at: "+0m", actor: agt_carol, entry: rest, op: record_feedback, input: {mission: DM-001, answers: {service: oui, worth: oui, corrections: aucune}}, key: k7, expect: {result: error, error: forbidden_role}}
      - {at: "+0m", actor: agt_carol, entry: rest, op: release_attempt, input: {attempt: att_0001, reason: Essai}, key: k8, expect: {result: error, error: forbidden_role}}
      - {at: "+0m", actor: agt_carol, entry: rest, op: suspend_project, input: {project: demo, decision: DEC-2026-999}, key: k9, expect: {result: error, error: forbidden_role}}
      - {at: "+0m", actor: agt_carol, entry: rest, op: revoke_authorization, input: {authorization: aut_alice}, key: k10, expect: {result: error, error: forbidden_role}}
      - at: "+0m"
        actor: agt_carol
        entry: mcp
        op: list_tools
        input: {}
        expect:
          result: ok
          excludes:
            path: tools
            values: [approve_submission, request_changes, reject_submission, cancel_mission, declare_contract_compatibility, publish_decision, record_feedback, release_attempt, suspend_project, revoke_authorization, merge, vote, sign]
          state:
            attempts: {att_0001: {state: in_review}}
            missions: {DM-001: {state: in_progress}}

  - id: CT-076
    title: Un jeton humain n'accède pas aux outils d'agent
    covers: []
    rules: [A2]
    given:
      missions: [{id: DM-001}]
    steps:
      - {at: "+0m", actor: user:pat, entry: rest, op: claim_mission, input: {mission: DM-001}, key: k1, expect: {result: error, error: forbidden_role}}
      - {at: "+0m", actor: user:carol, entry: rest, op: claim_review, input: {}, key: k2, expect: {result: error, error: forbidden_role, state: {missions: {DM-001: {state: open, generation: 0}}}}}

  - id: CT-077
    title: Autorisation révoquée ou échue en cours de tentative
    covers: ["T05:lease_timeout"]
    rules: [A6, F2]
    given:
      missions:
        - {id: DM-001, state: in_progress, generation: 1}
        - {id: DM-002, state: in_progress, generation: 1}
        - {id: DM-003}
      authorizations:
        - {id: aut_bob, expires_at: "+8m"}
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
        - {id: att_0002, mission: DM-002, agent: agt_bob, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+5m"
        actor: user:alice
        op: revoke_authorization
        input: {authorization: aut_alice}
        key: k1
        expect: {result: ok}
      - at: "+6m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0001, generation: 1}
        key: k2
        expect: {result: error, error: authorization_inactive}
      - at: "+6m"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-003}
        key: k3
        expect: {result: error, error: authorization_inactive}
      - at: "+8m"
        actor: agt_bob
        op: heartbeat
        input: {attempt: att_0002, generation: 1}
        key: k4
        expect: {result: error, error: authorization_inactive}
      - at: "+10m"
        expect:
          state:
            attempts:
              att_0001: {state: expired, ended_at: "+10m"}
              att_0002: {state: expired, ended_at: "+10m"}

  - id: CT-078
    title: Porteur d'un autre projet, administrateur et mandaté
    covers: []
    rules: [A4, A7]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: in_review, generation: 1}
      submissions:
        - {id: SUB-001, attempt: att_0001, state: current, commit: c0ffee1, contract_version: 1, decided_verdict: pass, approval: pending}
      requests:
        - {id: req_0009, fixture: request_human, state: open}
    steps:
      - {at: "+0m", actor: user:quinn, op: approve_submission, input: {submission: SUB-001}, if_match: current, key: k1, expect: {result: error, error: forbidden_role}}
      - {at: "+0m", actor: user:root, op: approve_submission, input: {submission: SUB-001}, if_match: current, key: k2, expect: {result: error, error: forbidden_role}}
      - {at: "+0m", actor: user:root, op: publish_decision, input: {request: req_0009, option: A}, key: k3, expect: {result: error, error: forbidden_role}}
      - {at: "+1m", actor: user:mia, op: publish_decision, input: {request: req_0009, option: A}, key: k4, expect: {result: ok, state: {requests: {req_0009: {state: decided}}}}}
      - {at: "+2m", actor: user:pat, op: approve_submission, input: {submission: SUB-001}, if_match: stale, key: k5, expect: {result: error, error: precondition_failed}}

  - id: CT-079
    title: Plafonds de flux du projet
    covers: ["T03:submit_work", "T10:claim_review"]
    rules: [F1]
    given:
      projects:
        - {id: demo, flow_limits: {max_in_production: 2, max_awaiting_review_or_integration: 1}}
      missions:
        - {id: DM-001, state: in_progress, generation: 1}
        - {id: DM-002, state: in_progress, generation: 1}
        - {id: DM-003}
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
        - {id: att_0002, mission: DM-002, agent: agt_bob, state: changes_requested, generation: 1, changes_due_at: "+14d", reason: verdict}
      submissions:
        - {id: SUB-002, attempt: att_0002, state: current, commit: c0ffee2, contract_version: 1, decided_verdict: changes_requested}
    steps:
      - at: "+1m"
        actor: agt_carol
        op: claim_mission
        input: {mission: DM-003}
        key: k1
        expect: {result: error, error: flow_limit_reached, response: {error: {details: {limit: max_in_production}}}}
      - at: "+2m"
        actor: agt_alice
        op: submit_work
        input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}
        key: k2
        expect: {result: ok}
      - at: "+3m"
        actor: agt_carol
        op: claim_mission
        input: {mission: DM-003}
        key: k3
        expect: {result: error, error: flow_limit_reached, response: {error: {details: {limit: max_awaiting_review_or_integration}}}}
      - at: "+4m"
        actor: agt_dan
        op: claim_review
        input: {}
        key: k4
        expect: {result: ok, response: {assignment: {attempt: att_0001}}}

  - id: CT-080
    title: "Budget épuisé : nouvelles réservations refusées, tentative en cours préservée"
    covers: ["T02:heartbeat"]
    rules: [F2]
    given:
      missions:
        - {id: DM-001}
        - {id: DM-002}
      authorizations:
        - {id: aut_alice, budget: {unit: missions, value: 1}}
    steps:
      - at: "+0m"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-001}
        key: k1
        expect: {result: ok, save: {a1: attempt.id}}
      - at: "+1m"
        actor: agt_alice
        op: claim_mission
        input: {mission: DM-002}
        key: k2
        expect: {result: error, error: budget_exhausted}
      - at: "+2m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: $a1, generation: 1}
        key: k3
        expect: {result: ok, response: {attempt: {lease_expires_at: "+12m"}}}

  - id: CT-081
    title: Environnement, risque et portée de l'autorisation
    covers: ["T01:claim_mission"]
    rules: [F3]
    given:
      missions:
        - {id: DM-001, risk: medium}
        - {id: DM-002, environment: vm}
        - {id: DM-003, project: autre}
    steps:
      - {at: "+0m", actor: agt_bob, op: claim_mission, input: {mission: DM-001}, key: k1, expect: {result: error, error: not_eligible, response: {error: {details: {reasons: [environment]}}}}}
      - {at: "+0m", actor: agt_bob, op: claim_mission, input: {mission: DM-002}, key: k2, expect: {result: error, error: not_eligible, response: {error: {details: {reasons: [environment]}}}}}
      - {at: "+0m", actor: agt_alice, op: claim_mission, input: {mission: DM-003}, key: k3, expect: {result: error, error: not_eligible, response: {error: {details: {reasons: [authorization_scope]}}}}}
      - {at: "+1m", actor: agt_alice, op: claim_mission, input: {mission: DM-001}, key: k4, expect: {result: ok}}
      - {at: "+1m", actor: agt_dan, op: claim_mission, input: {mission: DM-002}, key: k5, expect: {result: ok}}

  - id: CT-082
    title: Tentatives simultanées d'un agent
    covers: ["T01:claim_mission"]
    rules: [C2]
    given:
      missions:
        - {id: DM-001}
        - {id: DM-002}
        - {id: DM-003}
        - {id: DM-004, attempts: {mode: parallel, max: 3}}
      authorizations:
        - {id: aut_alice, max_concurrent: 2}
    steps:
      - {at: "+0m", actor: agt_alice, op: claim_mission, input: {mission: DM-001}, key: k1, expect: {result: ok}}
      - {at: "+0m", actor: agt_alice, op: claim_mission, input: {mission: DM-002}, key: k2, expect: {result: ok}}
      - {at: "+0m", actor: agt_alice, op: claim_mission, input: {mission: DM-003}, key: k3, expect: {result: error, error: max_attempts_reached}}
      - {at: "+1m", actor: agt_bob, op: claim_mission, input: {mission: DM-004}, key: k4, expect: {result: ok}}
      - at: "+1m"
        actor: agt_bob
        op: claim_mission
        input: {mission: DM-004}
        key: k5
        expect:
          result: error
          error: mission_already_claimed
          state:
            missions: {DM-004: {active_attempts: 1, generation: 1}}

  - id: CT-083
    title: Projet suspendu
    covers: ["T02:heartbeat"]
    rules: [F4]
    given:
      missions:
        - {id: DM-001, state: in_progress, generation: 1}
        - {id: DM-002, state: in_progress, generation: 1}
        - {id: DM-003}
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
        - {id: att_0002, mission: DM-002, agent: agt_bob, state: submitted, generation: 1}
      submissions:
        - {id: SUB-002, attempt: att_0002, state: current, commit: c0ffee2, contract_version: 1, submitted_at: "-1h"}
    steps:
      - at: "+1m"
        actor: user:root
        op: suspend_project
        input: {project: demo, decision: DEC-2026-999}
        key: k1
        expect: {result: ok}
      - {at: "+2m", actor: agt_carol, op: claim_mission, input: {mission: DM-003}, key: k2, expect: {result: error, error: project_inactive}}
      - {at: "+2m", actor: agt_alice, op: heartbeat, input: {attempt: att_0001, generation: 1}, key: k3, expect: {result: ok, response: {attempt: {lease_expires_at: "+12m"}}}}
      - {at: "+3m", actor: agt_dan, op: claim_review, input: {}, key: k4, expect: {result: ok, response: {assignment: null}, state: {attempts: {att_0002: {state: submitted}}}}}

  - id: CT-084
    title: Soumission sans rapport de consommation
    covers: ["T03:submit_work"]
    rules: [F5]
    given:
      missions: [{id: DM-001, state: in_progress, generation: 1}]
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
    steps:
      - at: "+5m"
        actor: agt_alice
        op: submit_work
        input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr"}
        key: k1
        expect: {result: error, error: usage_report_required, state: {attempts: {att_0001: {state: claimed}}}}
      - at: "+6m"
        actor: agt_alice
        op: submit_work
        input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}
        key: k2
        expect: {result: ok}

  - id: CT-085
    title: Opérations impossibles dans l'état de la tentative
    covers: []
    rules: [G4]
    given:
      missions:
        - {id: DM-001, state: awaiting_decision, generation: 1}
        - {id: DM-002, state: in_progress, generation: 1}
        - {id: DM-003, state: in_progress, generation: 1}
        - {id: DM-004, state: in_progress, generation: 1}
      attempts:
        - {id: att_0001, mission: DM-001, agent: agt_alice, state: awaiting_decision, generation: 1, active_minutes: 15, request: req_0001}
        - {id: att_0002, mission: DM-002, agent: agt_alice, state: submitted, generation: 1}
        - {id: att_0003, mission: DM-003, agent: agt_alice, state: in_review, generation: 1}
        - {id: att_0004, mission: DM-004, agent: agt_alice, state: claimed, generation: 1, claimed_at: "+0m", lease_expires_at: "+10m", deadline_at: "+60m"}
      requests:
        - {id: req_0001, fixture: request_switch, attempt: att_0001, state: open}
      submissions:
        - {id: SUB-002, attempt: att_0002, state: current, commit: c0ffee2, contract_version: 1}
        - {id: SUB-003, attempt: att_0003, state: current, commit: c0ffee3, contract_version: 1}
    steps:
      - {at: "+1m", actor: agt_alice, op: submit_work, input: {attempt: att_0001, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}, key: k1, expect: {result: error, error: invalid_transition}}
      - {at: "+1m", actor: agt_alice, op: report_progress, input: {attempt: att_0001, generation: 1, checkpoint: {summary: Essai}}, key: k2, expect: {result: error, error: invalid_transition}}
      - {at: "+1m", actor: agt_alice, op: heartbeat, input: {attempt: att_0002, generation: 1}, key: k3, expect: {result: error, error: invalid_transition}}
      - {at: "+1m", actor: agt_alice, op: report_progress, input: {attempt: att_0002, generation: 1, checkpoint: {summary: Essai}}, key: k4, expect: {result: error, error: invalid_transition}}
      - {at: "+1m", actor: agt_alice, op: submit_work, input: {attempt: att_0003, generation: 1, contract_version: 1, deliverable: "@pr", usage_report: "@usage"}, key: k5, expect: {result: error, error: invalid_transition}}
      - {at: "+1m", actor: agt_alice, op: contest_review, input: {attempt: att_0003, generation: 1, submission: SUB-003, reason: Essai}, key: k6, expect: {result: error, error: invalid_transition}}
      - at: "+1m"
        actor: agt_alice
        op: heartbeat
        input: {attempt: att_0003, generation: 1}
        key: k7
        expect:
          result: error
          error: invalid_transition
          state:
            attempts:
              att_0001: {state: awaiting_decision}
              att_0002: {state: submitted}
              att_0003: {state: in_review}
              att_0004: {state: claimed}
