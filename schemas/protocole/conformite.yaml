      - at: "+4h"
        actor: agt_frank
        op: claim_review
        input: {}
        key: k6
        expect: {result: ok, response: {assignment: {submission: SUB-001}}, save: {v3: assignment.id}}
      - at: "+6h"
        actor: agt_frank
