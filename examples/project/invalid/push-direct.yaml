# Invalide : le push direct et la fusion par une machine sont interdits.
schema_version: "2.1"
project:
  id: cartes-communes
  name: Cartes communes
  license: AGPL-3.0-only
  languages: [fr]
  repository: {provider: github, url: https://github.com/exemple/cartes-communes}
  contract: {id: CTR-2026-001, status: active}
missions: {directory: .tokenhood/missions/}
policies: {security: .tokenhood/policies/security.yaml, review: .tokenhood/policies/review.yaml}
flow_limits: {max_in_production: 3, max_awaiting_review_or_integration: 5}
contributions:
  direct_push: true
  require_human_merge: false
