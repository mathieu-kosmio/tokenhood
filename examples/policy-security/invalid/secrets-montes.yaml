# Invalide : aucun secret monté, et l'interdiction des appels LLM côté serveur est obligatoire.
schema_version: "2.1"
execution:
  isolated_environment_required_when: runs_project_commands
  network: restricted
  secrets_mounted: true
  acceptance_commands_source: default_branch_only
content:
  external_inputs_untrusted: true
  skills_cannot_relax_policies: true
forbidden: [direct_push_to_main]
