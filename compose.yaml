# Compose de référence de la plateforme (TH-013), utilisé tel quel par Coolify (ressource Docker Compose).
# Aucun port publié : le proxy de Coolify atteint les services sur le réseau interne.
# Domaines à déclarer dans Coolify : app. -> web:3000, api. -> api:3000.
# Secrets : SERVICE_PASSWORD_POSTGRES, que Coolify génère et conserve lui-même (variable magique) ; GITHUB_CLIENT_ID,
# GITHUB_CLIENT_SECRET et SESSION_SECRET (TH-102), à renseigner dans Coolify. En local ou en CI, les fournir dans
# l'environnement. Jamais dans le dépôt. Sans les trois derniers, la plateforme démarre, connexion indisponible.
# En local : SERVICE_PASSWORD_POSTGRES=<valeur> docker compose -f compose.yaml -f compose.local.yaml up --build

name: tokenhood

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: tokenhood-app
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    PORT: '3000'
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgres://tokenhood:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/tokenhood
    # Origine publique de l'API (adresse de rappel OAuth, lien de connexion) et domaine du cookie de session,
    # partagé par app. et api.
    PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.tokenhood.kosm.io}
    SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-tokenhood.kosm.io}

services:
  # Migrations de la base (ADR-002) : exécution unique à chaque déploiement, rejouable sans effet.
  migrate:
    <<: *app
    command: ['node', 'packages/db/dist/migrate.js']
    restart: 'no'
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ['node', 'apps/api/dist/server.js']
    environment:
      <<: *app-env
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://app.tokenhood.kosm.io}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ['node', 'apps/web/build/index.js']
    environment:
      <<: *app-env
      # Derrière le proxy TLS de Coolify : l'origine se lit dans les en-têtes transmis.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tokenhood
      POSTGRES_USER: tokenhood
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tokenhood -d tokenhood']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
