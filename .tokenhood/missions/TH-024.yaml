    - "docs/specs/en/garanties.md traduit toute la version 1 : mêmes sections et tableaux, dans le même ordre ; les 33 promesses G-01 à G-33 et les entrées R-01 à R-09 du registre gardent leurs identifiants, leur classe, leur mécanisme, leur test et leurs missions"
