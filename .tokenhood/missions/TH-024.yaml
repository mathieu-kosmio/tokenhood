    - "En-tête comme les autres modules anglais : lien vers la version française, statut de traduction machine ; dans docs/specs/garanties.md, seule la phrase qui annonce une version anglaise restée en V2.1 est retirée ou mise à jour"
    - "Liens relatifs résolus ; aucun changement de sens, un passage ambigu de la source se signale par une demande spec.clarification"
