schema_version: "2.1"
id: TH-029
version: 1
lot: 0
title:
  fr: "Qualificatif « éprouvé » du protocole de tokenpool dans la spécification"
  en: "Proven qualifier of the tokenpool protocol in the specification"
type: docs
objective: "Retirer de docs/specs/coordination.md et de sa version anglaise le qualificatif « éprouvé » (« proven ») donné au protocole de tokenpool, que l'audit de TH-006 n'établit pas, sans préjuger de la décision ADR-001."
scope:
  paths: [docs/specs/coordination.md, docs/specs/en/coordination.md]
inputs:
  paths: [decisions/ADR-001-dossier-options.md, decisions/ADR-001-coordination.md, docs/specs/coordination.md, docs/specs/en/coordination.md]
outputs:
