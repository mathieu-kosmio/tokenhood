acceptance:
  requirements:
    - "La phrase d'ouverture de coordination.md et de en/coordination.md ne qualifie plus le protocole de tokenpool d'éprouvé (proven) : elle dit ce qui en est repris, sans jugement de maturité que l'audit n'établit pas, et renvoie au dossier d'options d'ADR-001"
    - "Aucune autre modification du module : les mécanismes cités (réservations atomiques, preuves, bail, idempotence, préparation en lecture seule) restent ; ce que la coordination reprend ou non de tokenpool relève d'ADR-001, pas de cette mission"
    - "Les deux langues disent la même chose ; le statut de traduction de la version anglaise est conservé"
    - "Les autres emplois d'« éprouvé » dans docs/specs/ (processus d'admission, roadmap) ne visent pas tokenpool et restent inchangés"
dependencies:
  - mission: TH-006
    type: integrated
skills: [tokenhood-contribute@0.1]
languages:
