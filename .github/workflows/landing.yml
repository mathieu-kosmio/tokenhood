# Landing (TH-017) : tests du build, puis construction et essai de l'image servie par Coolify.
name: landing

on:
  pull_request:
    paths: ['landing/**', 'design/**', '.github/workflows/landing.yml']
  push:
    branches: [main]
    paths: ['landing/**', 'design/**', '.github/workflows/landing.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -f landing/Dockerfile -t tokenhood-landing .
      - name: Démarrer le conteneur
        run: |
          docker run -d --name landing -p 8080:8080 tokenhood-landing
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
      - name: Essais de fumée
        run: |
          set -eu
          check() { test "$1" = "$2" || { echo "attendu $2, obtenu $1 ($3)"; exit 1; }; }
          code() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1"; }
          check "$(code /healthz)" 200 /healthz
          check "$(code /)" 200 /
          check "$(code /en/)" 200 /en/
          check "$(code /mentions-legales/)" 200 /mentions-legales/
          check "$(code /en/privacy/)" 200 /en/privacy/
          check "$(code /page-inconnue)" 404 /page-inconnue
          curl -s http://127.0.0.1:8080/page-inconnue | grep -q 'This page does not exist'
          check "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8080/en)" "http://127.0.0.1:8080/en/" "redirection /en"
          curl -sI http://127.0.0.1:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -sI http://127.0.0.1:8080/ | grep -qi '^x-content-type-options: nosniff'
          css=$(curl -s http://127.0.0.1:8080/ | grep -o '/assets/site\.[a-f0-9]*\.css')
          curl -sI "http://127.0.0.1:8080$css" | grep -qi '^cache-control: max-age=315360000'
          curl -sI "http://127.0.0.1:8080$css" | grep -qi "^content-security-policy"
          uid=$(docker exec landing id -u); test "$uid" != 0 || { echo "le conteneur tourne en root"; exit 1; }
          echo "Image conforme : non root (uid $uid), pages, 404, en-têtes et cache vérifiés."
      - name: Journal du conteneur
        if: always()
        run: docker logs landing || true
