# TH-015 : scans de sécurité à chaque PR et sur main (secrets, vulnérabilités, dépendances, SDK de LLM).
# Chaque job est un statut à rendre obligatoire sur main, une fois ce workflow fusionné (voir CLAUDE.md).
# Aucun secret n'est utilisé : les PR ouvertes depuis un fork passent les mêmes contrôles.
name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Images officielles épinglées par version et par empreinte : jamais d'étiquette mobile
  # (les étiquettes de Trivy ont été détournées en mars 2026, CVE-2026-33634).
  # Mise à jour : nouvelle version publiée depuis au moins deux semaines, empreinte relevée sur le registre.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  # Ni télémétrie vers Aqua ni annonce de version dans les journaux.
  TRIVY_FLAGS: --skip-version-check --disable-telemetry

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commits à analyser (ceux de la PR, ou ceux poussés sur main)
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            range="$HEAD_SHA"
          else
            range="$BASE..$HEAD_SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          git log --oneline "$range"
      - name: Recherche de secrets dans l'historique (valeurs masquées)
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git --no-banner --redact --verbose --log-opts="$RANGE" /repo

  trivy-image:
    name: trivy-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image tokenhood-app (Dockerfile racine)
        run: docker build -t tokenhood-app .
      - name: Trivy sur l'image (échec sur HIGH ou CRITICAL corrigeable)
        run: |
          docker save tokenhood-app -o "$RUNNER_TEMP/tokenhood-app.tar"
          docker run --rm -v "$RUNNER_TEMP:/work:ro" "$TRIVY_IMAGE" image --input /work/tokenhood-app.tar \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress $TRIVY_FLAGS

  trivy-repo:
    name: trivy-repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy sur le dépôt (lockfiles et secrets ; échec sur HIGH ou CRITICAL corrigeable)
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE" fs /repo \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress $TRIVY_FLAGS
      - name: Configurations Dockerfile et compose (rapport, non bloquant)
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE" config /repo \
            --severity MEDIUM,HIGH,CRITICAL --exit-code 0 $TRIVY_FLAGS

  deps-audit:
    name: deps-audit
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activer pnpm (version du champ packageManager)
        run: corepack enable && pnpm --version
      - name: pnpm audit --prod (monorepo)
        run: pnpm audit --prod --audit-level moderate
      - name: npm audit --omit=dev (paquets npm autonomes, landing/ et tools/*)
        run: |
          status=0
          for lock in $(git ls-files '*package-lock.json'); do
            dir=$(dirname "$lock")
            echo "::group::npm audit $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=moderate) || status=1
            echo "::endgroup::"
          done
          exit $status

  no-llm-sdk:
    name: no-llm-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du contrôle
        run: node --test 'tools/no-llm-sdk/test/*.test.mjs'
      - name: Aucun SDK de fournisseur de LLM dans les package.json et les lockfiles
        run: node tools/no-llm-sdk/check.mjs .
      - name: Auto-vérification · openai ajouté volontairement à une copie du dépôt
        run: |
          copie=$(mktemp -d)
          git archive HEAD | tar -x -C "$copie"
          node -e '
            const fs = require("node:fs");
            const file = process.argv[1] + "/apps/api/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.dependencies.openai = "6.0.0";
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          ' "$copie"
          if node tools/no-llm-sdk/check.mjs "$copie" 2> "$RUNNER_TEMP/sortie.txt"; then
            echo "Le contrôle aurait dû échouer : openai ajouté à apps/api/package.json"; exit 1
          fi
          cat "$RUNNER_TEMP/sortie.txt"
          grep -q 'apps/api/package.json : openai' "$RUNNER_TEMP/sortie.txt"
          echo "Échec attendu obtenu : le SDK ajouté volontairement est détecté."
